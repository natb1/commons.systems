name: Functions — Deploy

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - ".github/workflows/functions-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: 'npm'
      - name: Install dependencies
        run: .claude/skills/dispatch-propagate/scripts/npm-ci-with-retry.sh
      - name: Build functions
        run: npm run -w functions build
      - name: Authenticate with Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: .github/scripts/firebase-auth.sh
      # feedProxy's and collectProjectSignals's non-secret defineString params come
      # from repository Secrets, written into the
      # dotenv firebase-tools reads at deploy time. firebase deploy resolves EVERY
      # defineString in non-interactive mode and fails if any is absent, even ones
      # with a code-level default, so every param must be written here. Params with a
      # natural default fall back to it inline; the rest must be set as repo Secrets.
      # The collectProjectSignals secrets (GOOGLE_ANALYTICS_CLIENT_SECRET / _REFRESH_TOKEN,
      # PAGESPEED_API_KEY) live in Secret Manager and do not flow through this workflow.
      - name: Write office-hours function config
        env:
          OFFICE_HOURS_GITHUB_APP_ID: ${{ secrets.OFFICE_HOURS_GITHUB_APP_ID }}
          OFFICE_HOURS_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OFFICE_HOURS_GITHUB_APP_INSTALLATION_ID }}
          OFFICE_HOURS_FIRESTORE_NAMESPACE: ${{ secrets.OFFICE_HOURS_FIRESTORE_NAMESPACE || 'office-hours/prod' }}
          OFFICE_HOURS_GROUP_ID: ${{ secrets.OFFICE_HOURS_GROUP_ID }}
          PROJECT_SIGNALS_GITHUB_REPO: ${{ secrets.PROJECT_SIGNALS_GITHUB_REPO || 'natb1/commons.systems' }}
          GOOGLE_ANALYTICS_CLIENT_ID: ${{ secrets.GOOGLE_ANALYTICS_CLIENT_ID }}
          PROJECT_SIGNALS_GA4_PROPERTY_ID: ${{ secrets.PROJECT_SIGNALS_GA4_PROPERTY_ID }}
          PROJECT_SIGNALS_GA4_HOST_APPS: ${{ secrets.PROJECT_SIGNALS_GA4_HOST_APPS }}
          PROJECT_SIGNALS_GSC_SITE: ${{ secrets.PROJECT_SIGNALS_GSC_SITE || 'sc-domain:commons.systems' }}
          PROJECT_SIGNALS_PSI_URLS: ${{ secrets.PROJECT_SIGNALS_PSI_URLS || 'https://commons.systems,https://budget.commons.systems,https://print.commons.systems,https://audio.commons.systems,https://fellspiral.commons.systems' }}
          PROJECT_SIGNALS_PSI_STRATEGY: ${{ secrets.PROJECT_SIGNALS_PSI_STRATEGY || 'mobile' }}
        run: |
          cat > functions/.env.commons-systems <<EOF
          OFFICE_HOURS_GITHUB_APP_ID=${OFFICE_HOURS_GITHUB_APP_ID}
          OFFICE_HOURS_GITHUB_APP_INSTALLATION_ID=${OFFICE_HOURS_GITHUB_APP_INSTALLATION_ID}
          OFFICE_HOURS_FIRESTORE_NAMESPACE=${OFFICE_HOURS_FIRESTORE_NAMESPACE}
          OFFICE_HOURS_GROUP_ID=${OFFICE_HOURS_GROUP_ID}
          PROJECT_SIGNALS_GITHUB_REPO=${PROJECT_SIGNALS_GITHUB_REPO}
          GOOGLE_ANALYTICS_CLIENT_ID=${GOOGLE_ANALYTICS_CLIENT_ID}
          PROJECT_SIGNALS_GA4_PROPERTY_ID=${PROJECT_SIGNALS_GA4_PROPERTY_ID}
          PROJECT_SIGNALS_GA4_HOST_APPS=${PROJECT_SIGNALS_GA4_HOST_APPS}
          PROJECT_SIGNALS_GSC_SITE=${PROJECT_SIGNALS_GSC_SITE}
          PROJECT_SIGNALS_PSI_URLS=${PROJECT_SIGNALS_PSI_URLS}
          PROJECT_SIGNALS_PSI_STRATEGY=${PROJECT_SIGNALS_PSI_STRATEGY}
          EOF
      - name: Deploy functions
        run: ./node_modules/.bin/firebase deploy --only functions --force --project default
      - name: Cleanup credentials
        if: always()
        run: .github/scripts/firebase-auth-cleanup.sh
