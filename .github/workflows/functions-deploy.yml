name: Functions — Deploy

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - ".github/workflows/functions-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: 'npm'
      - name: Install dependencies
        run: .claude/skills/dispatch-propagate/scripts/npm-ci-with-retry.sh
      - name: Build functions
        run: npm run -w functions build
      - name: Authenticate with Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: .github/scripts/firebase-auth.sh
      # Non-secret defineString params come from repository Secrets, written into
      # the dotenv file firebase-tools reads at deploy time. Unset secrets yield
      # empty values, which deploy the functions dormant. The GitHub App private
      # key is the only value that lives in Secret Manager (not here).
      - name: Write office-hours function config
        env:
          OFFICE_HOURS_GITHUB_APP_ID: ${{ secrets.OFFICE_HOURS_GITHUB_APP_ID }}
          OFFICE_HOURS_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OFFICE_HOURS_GITHUB_APP_INSTALLATION_ID }}
          OFFICE_HOURS_GROUP_REPO: ${{ secrets.OFFICE_HOURS_GROUP_REPO }}
          OFFICE_HOURS_GROUP_ID: ${{ secrets.OFFICE_HOURS_GROUP_ID }}
          OFFICE_HOURS_MEMBER_EMAILS: ${{ secrets.OFFICE_HOURS_MEMBER_EMAILS }}
          DISPATCH_METRICS_QUEUE_REPO: ${{ secrets.DISPATCH_METRICS_QUEUE_REPO }}
        run: |
          cat > functions/.env.commons-systems <<EOF
          OFFICE_HOURS_GITHUB_APP_ID=${OFFICE_HOURS_GITHUB_APP_ID}
          OFFICE_HOURS_GITHUB_APP_INSTALLATION_ID=${OFFICE_HOURS_GITHUB_APP_INSTALLATION_ID}
          OFFICE_HOURS_GROUP_REPO=${OFFICE_HOURS_GROUP_REPO}
          OFFICE_HOURS_GROUP_ID=${OFFICE_HOURS_GROUP_ID}
          OFFICE_HOURS_MEMBER_EMAILS=${OFFICE_HOURS_MEMBER_EMAILS}
          DISPATCH_METRICS_QUEUE_REPO=${DISPATCH_METRICS_QUEUE_REPO}
          EOF
      - name: Deploy functions
        run: npx firebase-tools deploy --only functions --force --project "$FIREBASE_PROJECT_ID"
      - name: Cleanup credentials
        if: always()
        run: .github/scripts/firebase-auth-cleanup.sh
