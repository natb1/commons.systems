name: Graph Fast Path

on:
  push:
    branches: ['graph/**']

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Verify the push is intentions/-only
        env:
          PUSHED_COMMITS: ${{ toJSON(github.event.commits.*.id) }}
        run: .github/scripts/check-graph-fast-path.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: 'npm'
      - name: Install workspace dependencies
        run: npm ci
      - name: Validate intention graph
        run: npx tsx packages/intentionsutil/scripts/validate-graph.ts intentions

  acceptance:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "graph fast path — intentions/-only push; required context stamped (real check runs in PR CI for code changes)"

  preview-and-smoke:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "graph fast path — intentions/-only push; required context stamped (real check runs in PR CI for code changes)"

  lint:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "graph fast path — intentions/-only push; required context stamped (real check runs in PR CI for code changes)"

  unit-tests:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "graph fast path — intentions/-only push; required context stamped (real check runs in PR CI for code changes)"
