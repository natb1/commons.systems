name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Disable unattended-upgrades / free dpkg lock
        # Same mitigation the preview-and-smoke job runs, from the same script —
        # see that job's copy below for the budget derivation. This job shells
        # out to apt-get through playwright's `install --with-deps` too, and it
        # shares the lib.sh `wait_for_dpkg_lock` backstop whose default this PR
        # left at 30s, so leaving it undefended would just move the flake.
        # Budget: 5 min here on top of this job's existing work, against the
        # 30-min job cap; the helper adds up to 12 waits x 30s = 6 min.
        timeout-minutes: 5
        continue-on-error: true
        run: .github/scripts/free-dpkg-lock.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: 'npm'
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - name: Run acceptance tests
        env:
          VITE_GITHUB_BRANCH: ${{ github.head_ref }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        run: .claude/skills/dispatch-propagate/scripts/run-all-acceptance-tests.sh

  preview-and-smoke:
    runs-on: ubuntu-latest
    # Raised 20 -> 30 to match the sibling `acceptance` job above. See the
    # additivity note on the dpkg-lock step below: 20 min could not hold the
    # worst case once the mitigation step's own cap is counted, and an
    # ambiguous budget is what let the original flake hide.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Disable unattended-upgrades / free dpkg lock
        # Budget derivation. The two budgets in play are ADDITIVE in the worst
        # case, and this comment used to imply they were alternatives:
        #   5 min   this step's own cap (below)
        # + ~11 min the original flake's real job work
        # + up to 12 min of lib.sh `wait_for_dpkg_lock` (DPKG_LOCK_WAIT_TIMEOUT
        #   is 30s and this job's call site fans out to 2 attempts x 2 smoke
        #   runs x 6 hosting apps = up to 24 waits = 12 min)
        #   ------
        #   = ~28 min, which does NOT fit the old 20-min job cap.
        # In practice the two are near-mutually-exclusive: `wait_for_dpkg_lock`
        # only waits AFTER a failed apt-get attempt, and preventing that failed
        # attempt is the entire point of this pre-step — when this step does its
        # job the helper waits ~0s, and when the helper is burning 12 min this
        # step has already lost. But "near-mutually-exclusive" is not a bound,
        # and the ambiguity is resolved rather than argued: the job cap above is
        # raised to 30 min, matching the sibling `acceptance` job, so even the
        # fully-additive worst case fits.
        # The step's own internal worst case (290s, under this 300s cap) is
        # derived in .github/scripts/free-dpkg-lock.sh, where every external
        # call is wrapped in `timeout`.
        # `continue-on-error: true` because this step is best-effort: every path
        # inside the script exits 0 by design, so the step cap below is the ONE
        # way this mitigation could itself block a PR. A mitigation that fails
        # the job it exists to protect is worse than no mitigation.
        #
        # Note: .github/workflows/unit-tests.yml also calls `sudo apt-get
        # update && sudo apt-get install -y zsh` (no pre-step like this one, no
        # raised timeout) — a third apt-get call site in this repo's CI left
        # deliberately unmitigated. It has no observed dpkg-lock flake history,
        # and it's a plain `apt-get install`, not the `playwright install
        # --with-deps` path whose timed-out apt-get tree is what strands the
        # lock for this job's kind of failure (see `playwright_install_with_deps`
        # / `wait_for_dpkg_lock` in
        # .claude/skills/dispatch-propagate/scripts/lib.sh). Adding this 5-min
        # best-effort step to a fast, frequently-run unit-test job costs more
        # than the unobserved risk is currently worth. If the flake is ever
        # observed there too, harden it the same way with
        # .github/scripts/free-dpkg-lock.sh.
        timeout-minutes: 5
        continue-on-error: true
        run: .github/scripts/free-dpkg-lock.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: 'npm'
      - name: Authenticate with Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: .github/scripts/firebase-auth.sh
      - name: Deploy previews and run smoke tests
        id: deploy
        env:
          VITE_GITHUB_BRANCH: ${{ github.head_ref }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        run: |
          set -o pipefail
          OUTPUT=$(.claude/skills/dispatch-propagate/scripts/run-all-preview-deploy-smoke.sh "pr-${{ github.event.pull_request.number }}" | tee /dev/stderr)
          # Extract multi-line preview comment from output
          COMMENT=$(echo "$OUTPUT" | sed -n '/^PREVIEW_COMMENT<<EOF$/,/^EOF$/{ /^PREVIEW_COMMENT<<EOF$/d; /^EOF$/d; p; }')
          if [ -n "$COMMENT" ]; then
            echo "preview_comment<<EOF" >> "$GITHUB_OUTPUT"
            echo "$COMMENT" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi
      - name: Comment preview URLs on PR
        if: success() && steps.deploy.outputs.preview_comment != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_COMMENT: ${{ steps.deploy.outputs.preview_comment }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "$PREVIEW_COMMENT"
      - name: Cleanup credentials
        if: always()
        run: .github/scripts/firebase-auth-cleanup.sh

  type-safety-sensor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Flag net-new type-safety escape hatches
        run: .github/scripts/check-type-safety-escapes.sh

  firestore-query-bounds-sensor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Flag unbounded Firestore getDocs queries
        run: .github/scripts/check-firestore-query-bounds.sh

  # The club project's documents and its published benchmark explorer are both
  # generated from projects/club/model/model.mjs. This fails the PR when a
  # generated figure was hand-edited, or when the model moved and the renderer
  # was not re-run — the drift this single-source arrangement exists to prevent.
  club-model-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Check the club model's invariants
        run: node model/verify.mjs
        working-directory: projects/club
      - name: Check the club docs and artifact are in sync with the model
        run: node model/render.mjs --check
        working-directory: projects/club
