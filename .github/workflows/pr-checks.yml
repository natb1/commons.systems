name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: 'npm'
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - name: Run acceptance tests
        env:
          VITE_GITHUB_BRANCH: ${{ github.head_ref }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        run: .claude/skills/dispatch-propagate/scripts/run-all-acceptance-tests.sh

  preview-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Disable unattended-upgrades / free dpkg lock
        run: |
          if command -v fuser >/dev/null 2>&1; then
            FUSER_OK=1
          else
            FUSER_OK=0
            echo 'WARNING: fuser not installed (psmisc missing) - dpkg lock state UNKNOWN, skipping lock probes'
          fi
          # apt-get takes the locks in this order (lock-frontend, lists/lock,
          # dpkg/lock); a bare `dpkg` takes only /var/lib/dpkg/lock. Probe, kill
          # and wait on all three so a non-apt holder is not invisible to us.
          set -- /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/lib/dpkg/lock
          if [ "$FUSER_OK" -eq 1 ]; then
            for lock in "$@"; do
              if [ ! -e "$lock" ]; then
                echo "$lock: absent, nothing to probe"
                continue
              fi
              echo "$lock holders at step start:"
              sudo fuser -v "$lock" || echo "$lock: no holders at step start"
            done
          fi
          if stop_err=$(sudo systemctl stop apt-daily.service apt-daily-upgrade.service apt-daily.timer apt-daily-upgrade.timer unattended-upgrades.service 2>&1); then
            echo 'systemctl stop: ok'
          else
            rc=$?
            echo "systemctl stop: failed (rc=$rc)"
            echo "$stop_err" >&2
          fi
          if kill_err=$(sudo systemctl kill --kill-who=all apt-daily.service apt-daily-upgrade.service unattended-upgrades.service 2>&1); then
            echo 'systemctl kill: ok'
          else
            rc=$?
            echo "systemctl kill: failed (rc=$rc)"
            echo "$kill_err" >&2
          fi
          if sudo pkill -9 -f '[u]nattended-upgrade' 2>/dev/null; then
            echo 'killed unattended-upgrade process(es)'
          else
            echo 'no unattended-upgrade process to kill'
          fi
          if sudo pkill -9 -f 'apt[.]systemd[.]daily' 2>/dev/null; then
            echo 'killed apt.systemd.daily process(es)'
          else
            echo 'no apt.systemd.daily process to kill'
          fi
          # --- SIGKILL stage ---------------------------------------------------
          # Everything above targets named units / known argv patterns. The
          # original flake's holder was a bare `apt-get` reparented out of its
          # unit's cgroup, which none of those reach. `fuser -k` is the
          # holder-agnostic last resort: it SIGKILLs whoever holds the file,
          # whatever it is and whoever started it.
          if [ "$FUSER_OK" -eq 1 ]; then
            for lock in "$@"; do
              [ -e "$lock" ] || continue
              if sudo fuser -k "$lock" >/dev/null 2>&1; then
                echo "fuser -k: killed holder(s) of $lock"
              else
                echo "fuser -k: no holders of $lock"
              fi
            done
          fi
          # Bounded wait: ONE shared 120s wall-clock deadline across all three
          # lock files, not 120s each — the job's total budget is fixed.
          if [ "$FUSER_OK" -eq 1 ]; then
            wait_deadline=$(( $(date +%s) + 120 ))
            for lock in "$@"; do
              if [ ! -e "$lock" ]; then
                echo "$lock: absent, no wait needed"
                continue
              fi
              if ! sudo fuser "$lock" >/dev/null 2>&1; then
                echo "$lock: already free, no wait needed"
                continue
              fi
              wait_start=$(date +%s)
              expired=0
              while sudo fuser "$lock" >/dev/null 2>&1; do
                if [ "$(date +%s)" -ge "$wait_deadline" ]; then
                  echo "$lock still held at the shared 120s deadline; holders:" >&2
                  sudo fuser -v "$lock" >&2 || true
                  expired=1
                  break
                fi
                sleep 1
              done
              if [ "$expired" -eq 0 ]; then
                echo "$lock freed after $(( $(date +%s) - wait_start ))s"
              fi
            done
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: 'npm'
      - name: Authenticate with Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: .github/scripts/firebase-auth.sh
      - name: Deploy previews and run smoke tests
        id: deploy
        env:
          VITE_GITHUB_BRANCH: ${{ github.head_ref }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        run: |
          set -o pipefail
          OUTPUT=$(.claude/skills/dispatch-propagate/scripts/run-all-preview-deploy-smoke.sh "pr-${{ github.event.pull_request.number }}" | tee /dev/stderr)
          # Extract multi-line preview comment from output
          COMMENT=$(echo "$OUTPUT" | sed -n '/^PREVIEW_COMMENT<<EOF$/,/^EOF$/{ /^PREVIEW_COMMENT<<EOF$/d; /^EOF$/d; p; }')
          if [ -n "$COMMENT" ]; then
            echo "preview_comment<<EOF" >> "$GITHUB_OUTPUT"
            echo "$COMMENT" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi
      - name: Comment preview URLs on PR
        if: success() && steps.deploy.outputs.preview_comment != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_COMMENT: ${{ steps.deploy.outputs.preview_comment }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "$PREVIEW_COMMENT"
      - name: Cleanup credentials
        if: always()
        run: .github/scripts/firebase-auth-cleanup.sh

  type-safety-sensor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Flag net-new type-safety escape hatches
        run: .github/scripts/check-type-safety-escapes.sh

  firestore-query-bounds-sensor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Flag unbounded Firestore getDocs queries
        run: .github/scripts/check-firestore-query-bounds.sh
