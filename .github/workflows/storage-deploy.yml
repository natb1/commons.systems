name: Storage — Deploy Rules

on:
  push:
    branches: [main]
    paths:
      - "storage.rules"

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: 'npm'
      - name: Install dependencies
        run: .claude/skills/dispatch-propagate/scripts/npm-ci-with-retry.sh
      - name: Authenticate with Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: .github/scripts/firebase-auth.sh
      - name: Deploy Storage rules
        run: ./node_modules/.bin/firebase deploy --only storage:rules --project default
      - name: Cleanup credentials
        if: always()
        run: .github/scripts/firebase-auth-cleanup.sh
