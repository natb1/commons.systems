name: Unit Tests & Lint

on:
  push:
    branches-ignore:
      # `main` is deliberately NOT ignored: a suite that never runs on the
      # branch it merges into cannot report post-merge breakage, so the first
      # symptom is the next unrelated PR going red for a failure it did not
      # cause. `graph/**` stays ignored — those refs carry intention-node
      # commits only, with no source to test.
      - 'graph/**'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Detect changed file categories
        id: changes
        run: .claude/skills/dispatch-propagate/scripts/detect-changes.sh
      - name: Install nix (if nix files changed)
        if: steps.changes.outputs.nix == 'true'
        uses: DeterminateSystems/nix-installer-action@d96bc962e61b3049ce8128d03d57a1144fa96539 # main
        with:
          extra-conf: |
            http2 = false
            fallback = true
      - name: Set up Java (if firestore.rules changed)
        if: steps.changes.outputs.rules == 'true'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: 'npm'
      - name: Install zsh (needed by zsh-shebang regression tests)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run unit tests
        run: .claude/skills/dispatch-propagate/scripts/run-unit-tests.sh

  rules-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Detect changed file categories
        id: changes
        run: .claude/skills/dispatch-propagate/scripts/detect-changes.sh
      - name: Set up Java (if firestore.rules changed)
        if: steps.changes.outputs.rules == 'true'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: 'npm'
      - name: Cache Firebase emulators
        if: steps.changes.outputs.rules == 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - name: Install workspace dependencies
        if: steps.changes.outputs.rules == 'true'
        run: .claude/skills/dispatch-propagate/scripts/npm-ci-with-retry.sh
      - name: Run rules-test suite
        id: run-rules-test
        if: steps.changes.outputs.rules == 'true'
        run: .claude/skills/dispatch-propagate/scripts/run-rules-test.sh
      - name: Report rules-test outcome
        if: always()
        run: |
          case "${{ steps.run-rules-test.outcome }}" in
            success)
              echo "rules-test suite ran and passed (rules-adjacent files changed)"
              ;;
            failure)
              echo "rules-test suite ran and failed (rules-adjacent files changed)"
              ;;
            skipped)
              echo "rules-test suite skipped (no rules-adjacent files changed, or a prior step failed before the suite could run)"
              ;;
            *)
              echo "rules-test suite outcome unknown: '${{ steps.run-rules-test.outcome }}'"
              ;;
          esac

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Detect changed file categories
        id: changes
        run: .claude/skills/dispatch-propagate/scripts/detect-changes.sh
      - name: Install nix (if nix files changed)
        if: steps.changes.outputs.nix == 'true'
        uses: DeterminateSystems/nix-installer-action@d96bc962e61b3049ce8128d03d57a1144fa96539 # main
        with:
          extra-conf: |
            http2 = false
            fallback = true
      - name: Set up Java (if firestore.rules changed)
        if: steps.changes.outputs.rules == 'true'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: 'npm'
      - name: Run lint
        run: .claude/skills/dispatch-propagate/scripts/run-lint.sh

  # validate-graph.ts is the graph write path's guard job (graph-fast-path.yml),
  # which triggers ONLY on graph/** pushes — so a change to the validator, to the
  # sensor registry it reads, or to the graph state itself is not exercised by the
  # CI of the PR that makes it. It first executes on the next unrelated writer's
  # scratch branch, where a failure leaves four required contexts non-success and
  # graph-commit refuses to land for every writer in the repo (the 2026-08-14
  # 54-minute write outage). Running it here fails the branch that made the
  # change instead.
  #
  # Deliberately NOT a required context: graph/** pushes do not run this workflow
  # at all, so a fifth required context would deadlock the graph fast path — the
  # very failure mode this job exists to prevent.
  graph-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Detect changed file categories
        id: changes
        run: .claude/skills/dispatch-propagate/scripts/detect-changes.sh
      # These two steps carry the same `|| github.ref == 'refs/heads/main'` gate
      # as the validation step below, and for no independent reason: they are
      # its prerequisites. Gating them on the diff alone would leave the
      # validation step running on a main push with no node and no tsx.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.changes.outputs.graph == 'true' || github.ref == 'refs/heads/main'
        with:
          node-version-file: .node-version
          cache: 'npm'
      - name: Install workspace dependencies
        if: steps.changes.outputs.graph == 'true' || github.ref == 'refs/heads/main'
        run: .claude/skills/dispatch-propagate/scripts/npm-ci-with-retry.sh
      # `--strict-sensors` is gated on `main`, not merely on this job. This
      # workflow's `branches-ignore` only excludes `graph/**`, and
      # detect-changes.sh sets `graph=true` for ANY `packages/intentionsutil/`
      # or `intentions/` change — so without the ref gate the fatal sensor
      # check would also run on every ordinary feature branch, turning a PR red
      # for a sensor de-registration some other `/align` round landed on main.
      # The flag's whole justification is that it is the POST-MERGE check;
      # branches keep the stderr warning, exactly as graph-fast-path.yml's
      # guard job does.
      #
      # The `|| github.ref == 'refs/heads/main'` disjunct stays, and it is NOT
      # a workaround for the vacuous-diff bug that detect-changes.sh has since
      # fixed. It is the coverage.
      #
      # This step's payload is not diff-scoped. `validate-graph.ts intentions
      # --strict-sensors` validates the WHOLE `intentions/` directory, so what
      # it checks does not depend on what the push touched: a graph that some
      # earlier landing left internally inconsistent is caught by the next main
      # push regardless of that push's contents. Gating a whole-directory
      # validation behind a diff detector throws that away. The concrete hole:
      # a multi-commit push to `main` fires one workflow run at the head
      # commit, detect-changes.sh reads HEAD^1..HEAD, and a graph edit carried
      # by any commit other than the last is invisible — the step skips and
      # strict validation never runs for that push at all.
      #
      # So the diff detector only decides whether to run this on NON-`main`
      # refs, where a full-graph validation on every feature branch would be
      # pure cost. On `main` it runs unconditionally. The two setup steps carry
      # the same disjunct because this step cannot run without them.
      - name: Validate intention graph
        if: steps.changes.outputs.graph == 'true' || github.ref == 'refs/heads/main'
        run: npx tsx packages/intentionsutil/scripts/validate-graph.ts intentions ${{ github.ref == 'refs/heads/main' && '--strict-sensors' || '' }}

  dead-code:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Detect changed file categories
        id: changes
        run: .claude/skills/dispatch-propagate/scripts/detect-changes.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.changes.outputs.deadcode == 'true'
        with:
          node-version-file: .node-version
          cache: 'npm'
      - name: Run dead-code check
        if: steps.changes.outputs.deadcode == 'true'
        run: .claude/skills/dispatch-propagate/scripts/run-dead-code.sh

  storybook-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Detect changed file categories
        id: changes
        run: .claude/skills/dispatch-propagate/scripts/detect-changes.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.changes.outputs.ds == 'true'
        with:
          node-version-file: .node-version
          cache: 'npm'
      - name: Run Storybook dev-server smoke test
        if: steps.changes.outputs.ds == 'true'
        run: .claude/skills/dispatch-propagate/scripts/run-storybook-smoke.sh

  artifact-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Detect changed file categories
        id: changes
        run: .claude/skills/dispatch-propagate/scripts/detect-changes.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.changes.outputs.artifact == 'true'
        with:
          node-version-file: .node-version
          cache: 'npm'
      - name: Install dependencies
        if: steps.changes.outputs.artifact == 'true'
        run: npm ci
      - name: Install Playwright chromium
        if: steps.changes.outputs.artifact == 'true'
        run: npx playwright install --with-deps chromium
      - name: Build artifacts, check the contract, render from disk
        if: steps.changes.outputs.artifact == 'true'
        run: .claude/skills/dispatch-propagate/scripts/run-artifact-check.sh

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: 'npm'
      - name: Run typecheck
        run: .claude/skills/dispatch-propagate/scripts/run-typecheck.sh

  hook-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: 'npm'
      - name: Install workspace dependencies
        run: .claude/skills/dispatch-propagate/scripts/npm-ci-with-retry.sh
      - name: Run approve-workflow-commands hook tests
        run: .claude/hooks/test-approve-workflow-commands.sh
      - name: Run approve-artifact hook tests
        run: .claude/hooks/test-approve-artifact.sh
      # The suites below guard SUTs that live OUTSIDE
      # .claude/skills/dispatch-propagate/scripts/ — .claude/workflows/*.js,
      # .claude/hooks/*.sh, packages/intentionsutil/scripts/*, and the doctrine
      # prose of other skills' SKILL.md. run-unit-tests.sh only sets
      # RUN_PR_SCRIPTS=true when a changed path matches
      # .claude/skills/dispatch-propagate/scripts/*, so its test-*.sh glob is NOT
      # a CI vector for them: a PR touching only the SUT would run nothing and
      # merge green. They are wired unconditionally here instead. Keep this list
      # in sync when adding a suite whose SUT is outside that scripts dir.
      - name: Run qa-fix partitionDispositions tests
        run: .claude/skills/dispatch-propagate/scripts/test-qa-fix-partition.sh
      - name: Run align-tactics resolveTempRefs tests
        run: .claude/skills/dispatch-propagate/scripts/test-align-tactics-tempref.sh
      - name: Run align-tactics phase-gates tests
        run: .claude/skills/dispatch-propagate/scripts/test-align-tactics-gates.sh
      - name: Run review-fix instrument-gate tests
        run: .claude/skills/dispatch-propagate/scripts/test-review-fix-instrument.sh
      - name: Run review-fix residue-death coverage tests
        run: .claude/skills/dispatch-propagate/scripts/test-review-fix-residue-death.sh
      - name: Run review-fix cross-lane dedup tests
        run: .claude/skills/dispatch-propagate/scripts/test-review-fix-xlane-dedup.sh
      - name: Run review-fix domain-sweep tests
        run: .claude/skills/dispatch-propagate/scripts/test-review-fix-domain-sweep.sh
      - name: Run review-fix diff-context tests
        run: .claude/skills/dispatch-propagate/scripts/test-review-fix-diff-context.sh
      - name: Run review-fix /review-plan gate tests
        run: .claude/skills/dispatch-propagate/scripts/test-review-plan-gate.sh
      - name: Run dispatch-review-plan-gate tests
        run: .claude/skills/dispatch-propagate/scripts/test-dispatch-review-plan-gate.sh
      - name: Run review-fix skeptic-batching tests
        run: .claude/skills/dispatch-propagate/scripts/test-review-fix-skeptic-batch.sh
      - name: Run dispatch-verify-instrument-invocation tests
        run: .claude/skills/dispatch-propagate/scripts/test-dispatch-verify-instrument-invocation.sh
      - name: Run dispatch-stop hook tests
        run: .claude/skills/dispatch-propagate/scripts/test-dispatch-stop-hook.sh
      - name: Run dispatch-office-hours-strip hook tests
        run: .claude/skills/dispatch-propagate/scripts/test-dispatch-office-hours-strip-hook.sh
      - name: Run fix-checks node-lane doctrine ratchet
        run: .claude/skills/dispatch-propagate/scripts/test-fix-checks-cas-guard.sh
      - name: Run align-tactics write-path freshness doctrine ratchet
        run: .claude/skills/dispatch-propagate/scripts/test-align-tactics-write-path-freshness.sh
      - name: Run align-tactics terminal-marker doctrine ratchet
        run: .claude/skills/dispatch-propagate/scripts/test-align-tactics-terminal-marker.sh
      - name: Run dispatch-terminal-gap-audit tests
        run: .claude/skills/dispatch-propagate/scripts/test-dispatch-terminal-gap-audit.sh
      - name: Run dispatch-chain worktree doctrine ratchet
        run: .claude/skills/dispatch-propagate/scripts/test-dispatch-chain-worktree-ratchet.sh
      - name: Run dispatch-conflict Lane 3 cwd doctrine ratchet
        run: .claude/skills/dispatch-propagate/scripts/test-dispatch-conflict-lane3-cwd-ratchet.sh
      - name: Run mark-node-terminal tests
        run: .claude/skills/dispatch-propagate/scripts/test-mark-node-terminal.sh
      - name: Run dispatch-graph-execute tests
        run: .claude/skills/dispatch-propagate/scripts/test-dispatch-graph-execute.sh
      - name: Run conflict-lane hold sweep tests
        run: .claude/skills/dispatch-propagate/scripts/test-lib-conflict-lane-hold.sh
      - name: Run provision-node-worktree tests
        run: .claude/skills/dispatch-propagate/scripts/test-provision-node-worktree.sh
      - name: Run dispatch-derive-node-target tests
        run: .claude/skills/dispatch-propagate/scripts/test-dispatch-derive-node-target.sh
      - name: Run assert-node-selection tests
        run: .claude/skills/dispatch-propagate/scripts/test-assert-node-selection.sh
      - name: Run dispatch-daemon-liveness sensor tests
        run: .claude/skills/dispatch-propagate/scripts/test-dispatch-daemon-liveness.sh
      - name: Run park-node CAS-guard tests
        run: packages/intentionsutil/scripts/test-park-node.sh
      - name: Run land-align-round tests
        run: packages/intentionsutil/scripts/test-land-align-round.sh
      - name: Run transition-node CAS-guard tests
        run: packages/intentionsutil/scripts/test-transition-node.sh
      - name: Run demote-node-to-implement CAS-guard tests
        run: packages/intentionsutil/scripts/test-demote-node-to-implement.sh
      - name: Run arm-wait CAS-guard tests
        run: packages/intentionsutil/scripts/test-arm-wait.sh
      - name: Run release-wait CAS-guard tests
        run: packages/intentionsutil/scripts/test-release-wait.sh
      - name: Run graph-commit tests
        run: packages/intentionsutil/scripts/test-graph-commit.sh
      - name: Run verify-landed tests
        run: packages/intentionsutil/scripts/test-verify-landed.sh
      - name: Run mint-mainqa-nodes tests
        run: packages/intentionsutil/scripts/test-mint-mainqa-nodes.sh
      - name: Run hold-node tests
        run: packages/intentionsutil/scripts/test-hold-node.sh
      - name: Run dispatch-ladder-advance tests
        run: .claude/skills/dispatch-ladder/scripts/test-dispatch-ladder-advance.sh
      - name: Run dispatch-ladder-await tests
        run: .claude/skills/dispatch-ladder/scripts/test-dispatch-ladder-await.sh
      - name: Run dispatch-ladder-run tests
        run: .claude/skills/dispatch-ladder/scripts/test-dispatch-ladder-run.sh
      - name: Run dispatch-ladder-spawn tests
        run: .claude/skills/dispatch-ladder/scripts/test-dispatch-ladder-spawn.sh
      - name: Run dispatch-ladder-status tests
        run: .claude/skills/dispatch-ladder/scripts/test-dispatch-ladder-status.sh
      - name: Run budget-config-load tests
        run: .claude/skills/budget/scripts/test-budget-config-load.sh
      - name: Run write-phase-log tests
        run: .claude/skills/dispatch-propagate/scripts/test-write-phase-log.sh
      - name: Run flake stale-head guard tests
        run: .claude/skills/dispatch-propagate/scripts/test-flake-stale-head-check.sh
      - name: Run stable-propagation gate tests
        run: .claude/skills/dispatch-propagate/scripts/test-run-smoke-tests.sh
      - name: Run prose-rule lint tests
        run: .claude/skills/dispatch-propagate/scripts/test-lint-prose-rules.sh
      - name: Run ds-drift lint tests
        run: .claude/skills/dispatch-propagate/scripts/test-lint-ds-drift.sh
      - name: Run review-fix write-surface guard tests
        run: .claude/skills/dispatch-propagate/scripts/test-review-fix-write-surface-guard.sh
      - name: Run fleet-alarm park-aware classify tests
        run: .claude/skills/dispatch-propagate/scripts/test-dispatch-fleet-alarm-classify.sh
      - name: Run worktree-remove hook tests
        run: .claude/hooks/test-worktree-remove.sh
      - name: Run statusline hook tests
        run: .claude/hooks/test-statusline.sh
      - name: Run type-safety escape-hatch sensor tests
        run: .github/scripts/test-check-type-safety-escapes.sh
      - name: Run Firestore query-bounds sensor tests
        run: .github/scripts/test-check-firestore-query-bounds.sh
      - name: Run test-integrity script tests
        run: .github/scripts/test-check-test-integrity.sh
      - name: Run graph fast-path guard script tests
        run: .github/scripts/test-check-graph-fast-path.sh
      - name: Run align-tactics tactic-mode target-node context tests
        run: .claude/skills/dispatch-propagate/scripts/test-align-tactics-target-context.sh
      # Appended at the END of this list on purpose. The block is being
      # rewritten as an accumulator in a separate change, and two other PRs are
      # inserting steps mid-list; a tail append is the position least likely to
      # conflict with any of them.
      #
      # This one needs an explicit step even though it matches the
      # test-*.sh glob run-unit-tests.sh already sweeps: that glob only fires
      # when a file under dispatch-propagate/scripts changed, and the whole
      # point of the ratchet is to catch a three-dot baseline reintroduced
      # ANYWHERE in the repo.
      - name: Run diff-base doctrine ratchet
        run: .claude/skills/dispatch-propagate/scripts/test-diff-base-doctrine.sh

  test-integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Check for test deletions / disabling skips
        run: .github/scripts/check-test-integrity.sh

  playwright-version-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Detect changed file categories
        id: changes
        run: .claude/skills/dispatch-propagate/scripts/detect-changes.sh
      - name: Install nix (only when flake or package-lock changed)
        if: steps.changes.outputs.nix == 'true' || steps.changes.outputs.playwright == 'true'
        uses: DeterminateSystems/nix-installer-action@d96bc962e61b3049ce8128d03d57a1144fa96539 # main
        with:
          extra-conf: |
            http2 = false
            fallback = true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.changes.outputs.nix == 'true' || steps.changes.outputs.playwright == 'true'
        with:
          node-version-file: .node-version
          cache: 'npm'
      - name: Install workspace dependencies
        if: steps.changes.outputs.nix == 'true' || steps.changes.outputs.playwright == 'true'
        run: .claude/skills/dispatch-propagate/scripts/npm-ci-with-retry.sh
      - name: Verify nix playwright-driver chromium matches npm @playwright/test
        if: steps.changes.outputs.nix == 'true' || steps.changes.outputs.playwright == 'true'
        run: nix develop --command .github/scripts/check-playwright-version-sync.sh

  type-safety-sensor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Flag net-new type-safety escape hatches
        run: .github/scripts/check-type-safety-escapes.sh

  firestore-query-bounds-sensor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Flag unbounded Firestore getDocs queries
        run: .github/scripts/check-firestore-query-bounds.sh

  go-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Detect changed file categories
        id: changes
        run: .claude/skills/dispatch-propagate/scripts/detect-changes.sh
      - name: Set up Go (if Go files changed)
        if: steps.changes.outputs.go == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - name: Run Go tests
        if: steps.changes.outputs.go == 'true'
        run: |
          set -euo pipefail
          # Capture the module list first: a discovery failure aborts under
          # set -e, and an empty result fails explicitly — feeding the loop
          # via process substitution would instead pass the job silently.
          modules=$(.claude/skills/dispatch-propagate/scripts/list-go-modules.sh)
          if [ -z "$modules" ]; then
            echo "::error::No Go modules discovered by list-go-modules.sh"
            exit 1
          fi
          failed=0
          while IFS= read -r dir; do
            echo "=== go test: $dir ==="
            (cd "$dir" && go test ./...) || failed=1
          done <<< "$modules"
          exit "$failed"

