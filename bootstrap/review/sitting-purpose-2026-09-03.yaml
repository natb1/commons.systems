key:
  authority:
    ratified: the author decided in the dialogue and wants to be asked before it changes; written at the ruling in the author's name
    delegated: the author handed the class of decision to the AI
    deferred: the AI decided within the author's rules and owes a review
  boldness:
    low: rests on the author's words or the record
    moderate: rests partly on the AI's knowledge of traditions or on its articulation
    high: rests mainly on the AI's judgment
  persistence:
    standing: a disposition or criterion that holds until re-answered
    shim: an artifact standing in for a materialization not yet made, declared on the node it serves with its liquidation condition
    proposal: no authority; dies at the ruling
    open question: a node with a question and no answer
    evidence: dated, never edited, cited with a pin
    not recorded: operational or session state, derived at need
  rulings:
    ratify: the node stands as shown, stamped ratified in the author's name
    ratify-with-edits: as shown after the edits in the note
    defer: stays deferred, in the review queue
    overrule: the note says what stands instead

