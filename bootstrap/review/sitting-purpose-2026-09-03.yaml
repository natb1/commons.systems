  - id: n-authority
    kind: node
    node: commons.systems/disposition-graph/authority
    question: Who may change an answer?
    title: The authority node, whole
    author_words:
      - date: 2026-09-02
        text: 'Any doctrine on the recorded graph (by definition ratified disposition) must be rolled back to deferred for review. Ratification can only be done by alignment periagogic/maieutic dialogue (what we are doing now, though via shim). The first valid ratifications/doctrine will be the outputs of this first alignment dialogue.'
      - date: 2026-09-02
        text: 'Authority: proposal. I think this is mislabeled by existing disposition. Proposal indicates a contradiction with doctrine and no authority to act (confirm?) but there is no doctrine yet, and you have bootstrapped deferred graph and implementation based on this disposition.'
      - date: 2026-09-03
        text: 'The ledger is a shim, it shouldn''t receive standing disposition. Ratified as a shim. The standing disposition (ratified) is that ratification happens only through alignment dialogue.'
      - date: 2026-09-03
        text: 'Author quotes on disposition are rarely expected to be recorded as disposition verbatim. Dialogue is expected to edit for clarification and writing quality. It may make sense to retain original author quotes as reference though - evaluate whether this function earns new schema.'
    change: >-
      Adds to today's recording: a node without a stamp is an open question;
      proposal is content, never a class, and dies at the ruling into an
      answer, a rejected alternative, or nothing; the deferred stamps are the
      review queue; the ruling that earned a ratified stamp is in the landing
      commit and restated in the rationale (q10). The prose list of traditions
      leaves the rationale for the stub tradition nodes (n-stub-traditions).
      The two shims declared today stay.
    facts:
      authority: ratified
      boldness: low; moderate on the ruling-in-the-record sentence
      persistence: standing
    alternatives:
      - text: Keep proposal as a fourth authority class.
        why: A class with no authority is a review-queue label, and the deferred stamp already is that queue; the page had labelled purpose "proposal" only because it had no stamp.
      - text: Quote the ruling verbatim in the node, as the node said until today.
        why: Open as q10.
    depends_on: [q10-quotes]
    proposed: |
      ---
      question: Who may change an answer?
      form: disposition
      authority:
        class: ratified
        by: Nathan Buesgens
        date: <the date of the ruling>
      under:
        - commons.systems/disposition-graph/model
      tier: global
      defines:
        - authority
        - ratified
        - delegated
        - deferred
        - doctrine
        - author
        - proposal
      shims:
        - artifact: "`LEDGER.md` on the implementation ref"
          for: the record of the author's rulings during bootstrap, held as evidence; while it stands no stamp is ratified, and the first ratified stamps are those the sitting on `purpose` writes
          liquidation: every entry is sorted into a node amendment, a criterion, a shim declaration, evidence, or nothing, and the file is deleted
          declared: 2026-09-02
        - artifact: the bootstrap grant, under which the AI stubs nodes and materialized implementation stamped deferred with no ratified ancestor
          for: the scope rule of this node before any answer is ratified
          liquidation: the root and the purpose node are ratified, after which every deferred answer stands under a ratified ancestor
          declared: 2026-09-02
      ---
      ## Answer

      Every answer carries a stamp: who holds it, with what class, and since when. A node without a stamp is an open question, not an answer. Ratified means the author decided, in the alignment dialogue after its dialectic, and wants to be asked before it changes. Ratification happens only through that dialogue: the session that ran the sitting writes the stamp in the author's name, and the ruling that earned it is in the record, in the commit that lands it and restated in the node's rationale; transcribing the author's words from any other record confers nothing, and no command does, since a script that stamps on request is a rubber stamp and the guard against rubber stamps is the dialectic itself. Delegated means the author handed that class of decision to the AI and does not want to be asked again. Deferred means the AI decided within the author's rules and owes the author a review; the deferred stamps are the author's review queue. Doctrine is the ratified answers taken together. A proposal is content, never a class: a candidate answer, an amendment, or a finding with no authority, recorded in a stamped node or in a sitting's record for the author's ruling, where it becomes an answer, a rejected alternative, or nothing. The AI exercises authority within scope: it may answer under a ratified ancestor, may change delegated answers at will, and records anything that would contradict doctrine or exceed its scope as a proposal, which acts on nothing until the author rules. A proposal that contradicts doctrine also triggers review of the delegated disposition it was made under.

      ## Rationale

      Attenuation: authority only narrows as it is handed down, never widens, so a breakout would have to be written up the tree, and nothing writes up. Rejected: recording out-of-scope answers as deferred, because deferred still acts; a ratify command run by the author as the act of ratification, because it guaranteed nothing, stamped under the same version-control identity every session commits with, and made the act a keystroke instead of a decision; proposal as an authority class, because a class with no authority is a review-queue label and the deferred stamp already is that queue.

  - id: n-node
    kind: node
    node: commons.systems/disposition-graph/node
    question: What is a node?
    title: The node node, whole; forms collapse to four
    author_words:
      - date: 2026-09-02
        text: 'Given the above: is "form: target" synonymous with "disposition"? Evaluate if "disposition" would be a better name for "target".'
      - date: 2026-09-02
        text: '"assumption" deserves a target disposition, along with "tradition" and "disposition" (if target is renamed to disposition). This is how vocabulary is recorded, not with something bolted on that will drift. Recommend how hyperlinks will avoid drift.'
      - date: 2026-09-02
        text: 'Is assumption a form at all? I think the concept of an assumption started as instrumentation. Something like "this answer is valid so long as this assumption holds". eg. using this platform is economical assuming we are operating at startup scale, but would fail to be economical at enterprise scale.'
      - date: 2026-09-02
        text: 'What is the function of a "rule" form? What''s not already handled by a target/disposition?'
      - date: 2026-09-02
        text: 'What is the rejected section a projection of. Should it be associated with the deferred authority somehow? An authority section projected into the documentation (with notes on pending ratification for deferred authority) would make more sense than a "rejected" section which seems ad-hoc.'
    change: >-
      Four forms: disposition (target and rule merged; whether it is to be
      achieved or maintained is carried by its criteria), archē, reading,
      tradition. Assumption leaves the forms and becomes a criterion kind.
      Every node carries a stamp or is an open question; proposal is content.
      The rationale carries the rejected alternatives with their reasons and
      the page projects them beside the stamp. The prose list of traditions
      leaves the rationale. Vocabulary stays with the nodes that define each
      term (n-form-vocabulary).
    facts:
      authority: ratified if q1 stands
      boldness: moderate; the achieve-or-maintain carrier is the goal-oriented requirements tradition, the merge is the author's question
      persistence: standing
    alternatives:
      - text: Keep rule as a form beside disposition.
        why: Open as q1; a rule is a disposition to be maintained, which its criterion already says.
      - text: Keep all five forms.
        why: Open as q1; assumption as a form recorded the same fact twice, once as form and once as criterion.
    depends_on: [q1-forms, q2-traditions-home]
    proposed: |
      ---
      question: What is a node?
      form: disposition
      authority:
        class: ratified
        by: Nathan Buesgens
        date: <the date of the ruling>
      under:
        - commons.systems/disposition-graph/model
      defines:
        - question
        - answer
        - rationale
        - form
      criteria:
        - kind: check
          ref: packages/disposition/validate.mjs on the implementation ref
          note: every file parses as one question, at most one answer, a stamp or none, and only defined fields
      ---
      ## Answer

      One question and its standing answer. The question is one line someone could ask the author. The answer is the current position in one of four forms: a disposition, something that should become or stay true, where whether it is to be achieved or maintained is carried by its criteria; an archē, a first principle held and never derived; a reading, what a tradition says about the answer above it; or a tradition, the root of a mounted body of thought or work. The rationale says why, and which alternatives were rejected and for what reason; the page projects those alternatives beside the stamp. Every node carries a stamp, or it is an open question awaiting its answer; a proposal is content in a stamped node or in a sitting's record, never a class of node. An assumption is not a form but a criterion: this answer holds so long as the assumption does. If a text answers two questions, it is two nodes. If a new answer replaces an old one, the node holds the new answer and version control holds the old.

      ## Rationale

      One question per node makes "same scope" decidable: two texts share a node only if one replaced the other. Target and rule were one form seen from two sides, achieve and maintain, which the goal-oriented requirements tradition carries on the goal's criterion rather than on its kind; assumption began as instrumentation, the condition under which an answer stays valid, and is recorded where it is checked. Rejected: the node as a topic, which mixes authority in one text; the node as a cluster around a default scope; history kept inside the node; five forms with target, rule, and assumption apart, because the split recorded the same fact twice, once as form and once as criterion.

