      ---
      ## Answer

      By criteria bound to the answer, and every page shows them or says the answer is unguarded. A criterion is one of three kinds: a check the machine runs; an assessment, a dated human judgment; or an assumption, a condition about the world under which the answer holds, which is not a form of answer but a criterion, and whose failure sends the question back to the author. A criterion also says whether the answer is to be achieved, so that its failing check is work on the frontier, or maintained, so that its failing check is a variance that gates the work that broke it. A ratified answer with no criterion is unguarded, and the record says so. An archē is never tested by derivation; it is re-grasped, and only on events, never on a calendar: a proposal under it rejected for conflict with it; a failed assumption in its subtree; an action taken under it that the author rejects at review; anomalies past a ratified threshold; a reading under it re-ratified with a changed verdict. A proposal that contradicts doctrine also opens review of the delegated disposition it came from. Expiry stays where the traditions put it, on delegated authority and on assessments of lower answers.

      ## Rationale

      The author rejected cadence review of first principles on 2026-09-02; the record diverges from the periodic-convention strand and adopts Peirce, for whom inquiry begins with genuine doubt from surprise and manufactured doubt is paper doubt. Assumption moved from the forms to the criteria because it was instrumentation from the start, the condition under which an answer stays valid, and the requirements tradition records domain assumptions beside the specification for the same reason. Rejected: criteria as nodes of their own, because a criterion that needs its own stamp is a question of its own and becomes a node then; a single instrument per node, because an answer commonly has a check and an assessment. Open: whether a delegated stamp itself sunsets.

  - id: n-readings
    kind: node
    node: commons.systems/disposition-graph/readings
    question: How are references to tradition recorded?
    title: The readings node, whole; tradition as mount
    author_words:
      - date: 2026-09-02
        text: 'Re-evaluate the naming and function of the form "READING (RDG)" - we have been using the term "tradition" up until now, is this different? My concept of the tradition node is that it is a mount of another project - a philosophical tradition, or a body of research, or another code repo. It is a mount because it could theoretically be represented by its own graph with its own arche and its own reference to traditions. In lieu of a fully articulated disposition graph, a tradition may list primary references/readings. A disposition in the greenfield graph may reference tradition as either supporting by or diverging from disposition. That reference (supporting or diverging) may be ratified (if I have read the primary sources or understand the hypothetic mounted graph and can confirm support or divergence), delegated (if I accept AI judgement on the reference), or deferred (if I accept AI judgement pending review). Given the model of tradition as graph mount, recommend, how should multiple questions that reference the same tradition be encoded?'
      - date: 2026-09-02
        text: 'references to tradition in the prose of the documentation projection (such as the answer) should hyperlink to the tradition node. I like how target dispositions are hyperlinked, keep that.'
      - date: 2026-09-02
        text: 'do not replicate tradition references in the rationale section. There is already a tradition section. Confirm the tradition section is projected from the references, not duplicated in the node body.'
    change: >-
      Tradition and reading are distinguished. A tradition is a mount, one
      root node in a traditions graph until it has a graph of its own, carrying
      the name it defines and its primary references. A reading is one node's
      reference to a tradition, under the node it bears on, with source,
      locus, relation, and a stamp. Many questions reading one tradition are
      many readings naming one tradition, and the tradition's page shows them
      all. Prose links to a tradition through the name it defines. A rationale
      never repeats the readings.
    facts:
      authority: ratified if q2 stands
      boldness: moderate
      persistence: standing
    alternatives:
      - text: Stamped entries in a field with a derived reading frontier, the author's first framing.
        why: Workable; parsimony of mechanism against parsimony of files, and a reading needs its own hash and pin.
      - text: One node per tradition inside this graph.
        why: A tradition is not a disposition of this project; it is mounted, not held (q2).
    depends_on: [q2-traditions-home]
    proposed: |
      ---
      question: How are references to tradition recorded?
      form: disposition
      authority:
        class: ratified
        by: Nathan Buesgens
        date: <the date of the ruling>
      under:
        - commons.systems/disposition-graph/model
      defines:
        - reading
        - tradition
        - adopted
        - diverged
        - chosen over
      ---
      ## Answer

      As readings under the node that refers, and traditions they refer to. A tradition is a mount: a philosophical tradition, a body of research, or another repository, which could be a disposition graph of its own with its own archē and its own readings, and until it is articulated is one root node in the traditions graph, carrying the name it defines and its primary references. A reading is a node under the disposition it bears on, naming the tradition it reads, its source and locus, and its relation: adopted, where the tradition supports the answer; diverged, where the answer departs and says why; or chosen over, where a rival tradition was weighed. A reading carries a stamp like any node: ratified when the author has read the primary source or understands the mounted graph and confirms the relation, delegated when the AI's reading stands and the author declines to review it, deferred when the author accepts it for now and queues the primary reading. Deferred reading is recursive: one source leads to another, and a reading may sit under a reading. A reading whose verdict changes on re-reading is a re-grasp trigger for the node it grounds, not an automatic failure of it. Many questions that read one tradition are many readings naming that tradition, and the tradition's page shows every reading that cites it. Prose reaches a tradition through the name it defines, and the rationale of a node never repeats its readings.

      ## Rationale

      The author's rulings of 2026-09-02 that tradition references carry authority classes and that a tradition is a mount. Making readings nodes rather than field entries buys four things: one tradition is stored once and read under each node it grounds; readings nest, which is what recursion needs; a reading has its own hash and pin, so a changed reading is distinguishable from a changed answer; and there is one write path, one queue, and one stamp vocabulary. Rejected: stamped entries in a field with a derived reading frontier, workable and the author's first framing, parsimony of mechanism against parsimony of files; readings in the rationale prose, which drift and cannot carry a stamp; one node per tradition inside this graph, because a tradition is not a disposition of this project and is mounted rather than held.

