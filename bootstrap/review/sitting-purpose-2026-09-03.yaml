questions:
  - id: q1-forms
    title: Forms
    question: Which forms may an answer take?
    context: >-
      Today the schema has five forms: target, rule, assumption, archē,
      reading. The author asked whether target is synonymous with disposition,
      what rule adds, and whether assumption is a form at all. The
      goal-oriented requirements tradition carries achieve and maintain on the
      goal's criterion, not on its kind, and the requirements tradition records
      domain assumptions beside the specification as conditions, not goals.
    options:
      - label: Four forms, target and rule merged as disposition, assumption a criterion kind, tradition added
        recommended: true
        facts: {authority: ratified, boldness: moderate, persistence: standing}
      - label: Keep rule as a form beside disposition
        facts: {authority: ratified, boldness: moderate, persistence: standing}
      - label: Keep all five forms
        facts: {authority: ratified, boldness: low, persistence: standing}
    feeds: [n-node, n-instruments, n-purpose, n-knowledge-store, n-capture]

  - id: q2-traditions-home
    title: Where traditions live
    question: Where does a tradition node live?
    context: >-
      A tradition is a mount. It could be a graph of its own; until it is, it
      is one root node carrying its name and primary references. The manifest
      already carries a second graph, public, with a declared move.
    options:
      - label: One traditions graph on this ref, one root node per tradition
        recommended: true
        facts: {authority: ratified, boldness: moderate, persistence: standing}
      - label: A graph per tradition
        facts: {authority: ratified, boldness: moderate, persistence: standing}
      - label: Tradition nodes inside the disposition graph
        facts: {authority: ratified, boldness: low, persistence: standing}
    feeds: [n-readings, n-namespaces, n-harness-tradition, n-stub-traditions]

  - id: q4-hexis
    title: Hexis first
    question: In the purpose answer, is the hexis claim stated first and the knowledge store as its gloss?
    context: >-
      The page said "a knowledge store, a projection of its author's hexis".
      The draft says "a projection of its author's hexis, which is what a
      knowledge store would hold". Aristotle, Nicomachean Ethics II.5, makes
      hexis the settled state itself, and the record is the projection of it;
      a store is what would hold that projection.
    options:
      - label: Hexis first, knowledge store as its gloss
        recommended: true
        facts: {authority: ratified, boldness: moderate, persistence: standing}
      - label: Knowledge store first, as the page had it
        facts: {authority: ratified, boldness: low, persistence: standing}
    feeds: [n-purpose]

  - id: q6-second-stop
    title: The second stop
    question: What does a newcomer read after purpose?
    context: >-
      The author asked for a disposition that introduces the primitives well
      enough to use the skill, and found "How is intent recorded here" too
      reference-shaped. The model node is that question; its answer can be
      rewritten for that reader, or a new node can sit between purpose and it.
    options:
      - label: Rewrite the model node's answer (n-model) and boost growth first among its children
        recommended: true
        facts: {authority: deferred on the draft; ratified on the boost, boldness: moderate, persistence: standing}
      - label: A new primer node between purpose and model
        facts: {authority: deferred, boldness: moderate, persistence: standing}
    feeds: [n-model]

  - id: q8-purpose-criteria
    title: Criteria on purpose
    question: What criteria guard the purpose node?
    context: >-
      Every page will show its criteria or the word unguarded. The draft gives
      purpose a check, every unit of work the harness dispatches cites the node
      it serves, and an assessment, work done in the author's name since the
      last sitting traced to a recorded disposition. Both are the AI's
      drafting.
    options:
      - label: The check and the assessment as drafted
        recommended: true
        facts: {authority: deferred, boldness: moderate, persistence: standing}
      - label: Defer criteria to a later sitting; purpose shows as unguarded
        facts: {authority: ratified, boldness: low, persistence: standing}
    feeds: [n-purpose]

  - id: q10-quotes
    title: The author's words
    question: How are the author's words retained when a ruling is recorded?
    context: >-
      The author, 2026-09-03: quotes are rarely recorded as disposition
      verbatim; dialogue edits for clarification and writing quality; retaining
      the original quote as reference may earn schema, and would be subject to
      the accumulation rule, appended records rolled up with git holding
      history. Today growth, transience, and review quote the author verbatim
      in their rationales, and authority says the ruling is quoted in the node.
    options:
      - label: No new schema. The ruling verbatim in the message of the commit that lands it; the rationale restates it; a quote appears inline only where the wording itself is the decision
        recommended: true
        facts: {authority: ratified, boldness: moderate, persistence: standing, on: authority and growth}
      - label: A rulings list appended on the node, rolled up into the rationale at the next sitting
        facts: {authority: ratified, boldness: moderate, persistence: standing}
      - label: A sittings graph holding each sitting's record as evidence, cited by the nodes it ruled on
        facts: {authority: ratified, boldness: high, persistence: standing}
    feeds: [n-authority, n-growth, n-transience]

  - id: q11-ledger-sunset
    title: The ledger
    question: Is the ledger migrated and deleted now, or at exit?
    context: >-
      The ledger holds thirty-eight entries: the author's rulings, proposals,
      and owed items. A survey classifying each entry into a deferred node
      amendment, a criterion, a shim declaration, evidence, or nothing, and
      each section of the operations document likewise, is at
      bootstrap/ledger-migration-survey-2026-09-03.md. The ledger is declared
      as a shim on authority with its deletion as the liquidation condition.
    options:
      - label: Migrate now, per the survey, and delete the file before the next sitting; the operations document keeps only what is operational
        recommended: true
        facts: {authority: ratified, boldness: moderate pending the survey, persistence: "the outputs standing or shims; the deletion is the shim's liquidation"}
      - label: At exit, as first planned
        facts: {authority: ratified, boldness: low, persistence: shim}
    feeds: [n-authority, n-session-context]

  - id: q12-review-context
    title: Context of a review item
    question: What must every review item carry?
    context: >-
      The author, 2026-09-03: each review item must have sufficient context
      for a ruling; the partial edits of the first playback did not. The
      recommendation is the shape of this page.
    options:
      - label: One node per item, carrying the node's question, the author's words it rests on with dates, the node as it would stand whole with the change marked against the current text, the three facts, the alternatives rejected and why, and the rulings open
        recommended: true
        facts: {authority: ratified, boldness: low, persistence: standing, on: growth}
      - label: Items per change, with the changed sentence and a description, as the first playback did
        facts: {authority: ratified, boldness: low, persistence: standing}
    feeds: [n-growth]

  - id: q13-review-artifact
    title: The review page
    question: Is a published page the surface for the ruling stage of a sitting?
    context: >-
      The page can record the author's responses directly: it declares the
      db capability, writes one document per item, and the session reads them
      back with the read_db action; a copy button is the fallback. The
      periagogic and maieutic exchanges stay in the chat. The page is a shim
      declared on growth, liquidated when the implementation projects the
      review page from the record of a sitting and reads the rulings from it.
    options:
      - label: Adopt the page, as a shim on growth; responses read from its database
        recommended: true
        facts: {authority: ratified as a shim, boldness: moderate, persistence: shim, liquidation: the implementation projects the review page from the record of a sitting and reads the rulings from it, and the hand-built page and its builder are deleted}
      - label: The page for reading only; responses by copy and paste into the chat
        facts: {authority: ratified as a shim, boldness: low, persistence: shim}
      - label: Stay in the chat
        facts: {authority: ratified, boldness: low, persistence: not recorded}
    feeds: [n-growth]

  - id: q14-rationale-edge
    title: Rationale and the under edge
    question: Is the rationale the prose of the under edge?
    context: >-
      The purpose node's rationale opens with why the question exists under
      its parent, and the under node says a parent is found by asking why the
      question exists. Two justifications are being run together. Why this
      question exists is the refinement, which the edge records and which is
      usually evident from the two questions side by side. Why this answer
      stands is the backing: it cites readings, evidence, and the parent, and
      weighs the alternatives, and it is the node's own. It does not always
      stem from the parent: the node node's rationale is about decidability of
      scope, the persistence node's about concurrency, neither about model. In
      Toulmin's layout the warrant of an inference and the backing of a claim
      are distinct; in IBIS the relation carries the link's meaning without
      prose; in goal-oriented requirements a refinement link carries a pattern,
      not text. A node with two parents would need two edge rationales but has
      one answer.
    options:
      - label: Keep the rationale as the node's own, why this answer stands; the under edge carries no prose, and where a refinement is not evident from the two questions the rationale's first sentence says so
        recommended: true
        facts: {authority: ratified, boldness: moderate, persistence: standing}
      - label: Give each under entry a because clause and reserve the rationale for the answer
        facts: {authority: ratified, boldness: moderate, persistence: standing; a schema change}
      - label: Move the whole rationale onto the edge
        facts: {authority: ratified, boldness: high, persistence: standing; a schema change}
    feeds: [n-under, n-node, n-purpose]

  - id: q15-tier
    title: Scope of a rule
    question: What gives a rule its scope?
    context: >-
      Three nodes carry tier global (authority, session-context, evaluation)
      and the rules projection reads the flag. Every concern has a scope: a
      typing convention does not bind purpose. Topology alone fails, because a
      rule's home question and its scope differ (evaluation lives under growth
      and binds every evaluation). Citations alone fail unless they inherit.
      Together they suffice: a rule binds the subtree of every node that cites
      it, inherited along under; a rule cited by purpose binds the repository;
      the rules projection is the rules cited at purpose, and a bite's
      ancestry projection carries the rules cited along its ancestry. Tier is
      then derived and the field is pruned; every field name and value on a
      page links to the node that defines it, so nothing appears in the
      projection that no node defines.
    options:
      - label: Prune tier; a rule's scope is the subtrees of the nodes that cite it; the rules projection is the rules cited by purpose; the ancestry projection carries the rules cited along the ancestry
        recommended: true
        facts: {authority: ratified, boldness: moderate, persistence: standing; a schema change}
      - label: Keep tier as a stored flag
        facts: {authority: ratified, boldness: low, persistence: standing}
      - label: Scope by under alone, a rule binds the subtree it sits in
        facts: {authority: ratified, boldness: moderate, persistence: standing}
    feeds: [n-under, n-node, n-projection, n-session-context, n-authority]

  - id: q16-rejected
    title: Rejected alternatives
    question: How are rejected alternatives recorded?
    context: >-
      Today they are prose in the rationale, which the author finds ad hoc,
      and the authority section is to project them. Decision records (Nygard,
      2011; MADR) keep the considered options as structure with the reason
      each lost; IBIS keeps every position with the arguments against it. A
      list on the node gives the projector the structure and keeps the
      rationale to why the standing answer stands.
    options:
      - label: A rejected list on the node, each entry one alternative answer and why it lost, projected in the authority section; the rationale keeps only why the standing answer stands
        recommended: true
        facts: {authority: ratified, boldness: moderate, persistence: standing; a schema change}
      - label: Rejected alternatives as nodes of their own with a rejected class
        facts: {authority: ratified, boldness: high, persistence: standing}
      - label: Prose in the rationale, as now
        facts: {authority: ratified, boldness: low, persistence: standing}
    feeds: [n-node, n-under, n-projection, n-purpose, n-authority]
