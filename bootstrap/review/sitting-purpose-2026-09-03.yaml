items:
  - id: n-purpose
    kind: node
    node: commons.systems/disposition-graph/purpose
    question: What is this repository for?
    title: The purpose node, whole
    author_words:
      - date: 2026-09-02
        text: '"the factory is whatever agents act on them" - the factory is the reconciliation of disposition with implementation (wordsmith this and validate against tradition).'
      - date: 2026-09-02
        text: '"It records the person''s dispositions as a graph, and the work is derived from that record rather than from prompts or chat" - more like dialog with AI is used to maintain a person''s dispositions as graph using an `/align` skill (hyperlink to disposition), rather than executing tasks directly. Then, a harness (reference to tradition) directs long horizon work on that graph.'
      - date: 2026-09-02
        text: '"The author''s words for this answer (2026-09-02) are quoted in the ledger, entry L12" don''t refer to the ledger in the disposition. Disposition must resist drift. ledger is temporary bootstrap scaffolding.'
      - date: 2026-09-02
        text: 'Also reference harnesses as a tradition. But, do not replicate tradition references in the rationale section. There is already a tradition section.'
      - date: 2026-09-02
        text: '"Defining the repository by its parts." - agreed not for this node, though the graph must provide disposition for both the graph and the harness. Both serve the purpose described in this node.'
      - date: 2026-09-02
        text: '"Intent carried in prompts, chat, or memory." - noted'
      - date: 2026-09-02
        text: '"Issue trackers as the record of intent." - ratified. Issue trackers and the scrum-like workflows that operate on them are designed for humans with different requirements that don''t fit the purpose described in this node'
      - date: 2026-09-02
        text: 'Is this correctly encoded as form: assumption vs form: disposition with unvalidated instrumentation? Is assumption a form at all? I think the concept of an assumption started as instrumentation.'
      - date: 2026-09-03
        text: 'Rather that deferring a partial edit to a disposition which is confusing (how is that even recorded) the artifact would allow you to show me the edit to the disposition and approve the disposition as a whole.'
    change: >-
      The mechanism sentence is rewritten in the author's terms and "explicit"
      is struck. The factory is defined as the reconciliation of the standing
      answers with implementation, in both directions. The ledger reference is
      gone. The two hypotheses are carried as dispositions with criteria not
      yet validated, not as assumptions. The rationale no longer lists
      readings; the harness and the reconciliation loop become readings under
      this node and the work loop. The rejected alternatives move into the
      rationale with the author's reasons, and the strongest form of the
      incumbent's framing is added as a rejected alternative. Two criteria are
      added. The stamp is written at the ruling.
    facts:
      authority: ratified
      boldness: low on the answer; moderate on the criteria and the added rejected alternative
      persistence: standing
    alternatives:
      - text: Keep "explicit intent".
        why: The author struck it; making intent explicit is what the record does, so the adjective claimed a precondition.
      - text: Knowledge store first, hexis as its gloss, as the page had it.
        why: q4 puts hexis first because it is the claim and the knowledge store is what would hold it.
      - text: Drop the rejected alternatives from the node.
        why: The author ratified the issue-tracker reason and noted the other two; what was rejected is part of how the answer stands.
      - text: Defer criteria to a later sitting and show purpose as unguarded.
        why: Open as q8; the drafted pair is the AI's, not the author's.
    depends_on: [q1-forms, q4-hexis, q8-purpose-criteria]
    proposed: |
      ---
      question: What is this repository for?
      form: disposition
      authority:
        class: ratified
        by: Nathan Buesgens
        date: <the date of the ruling>
      under:
        - commons.systems/public/agency
      criteria:
        - kind: check
          ref: the dispatch harness on the implementation ref
          note: every unit of work the harness dispatches cites the node it serves
        - kind: assessment
          ref: the sitting on this node
          note: work done in the author's name since the last sitting traced to a recorded disposition
      ---
      ## Answer

      This repository exists so that a person can keep long-horizon AI work aligned with their intent. Dialogue with an AI maintains the person's dispositions as a graph through the alignment skill, rather than executing tasks directly; a harness then directs long-horizon work on that graph. It is something like spec-driven development applied to a software factory, where the specification is the person's standing answers and the factory is the reconciliation of those answers with implementation, in both directions. Its intended readers are humans who want that, and who may arrive here by way of an AI tasked with the same goal.

      Two further functions are hypotheses, recorded under this node as dispositions whose criteria are not yet validated: that the same record is a projection of its author's hexis, which is what a knowledge store would hold; and that the same discipline helps manage capture of the author's intention in the variety of ways it occurs in daily life, through a variety of institutions, not only misaligned AI writing software.

      ## Rationale

      Why it matters leads up to the archē this node refines. Delegating work to autonomous tools is expected and good; it buys attention at the level where intent is set. What must not be lost is the person's standing as the origin of what is done in their name, and the capacity to notice capture and recover. A record of intent that the tools act under, and that the person can read, amend, and rank, is how the origin stays with the person while the tools work. The graph and the harness both serve this purpose, and the graph gives disposition for both.

      Rejected: defining the repository by its parts, a data structure plus a harness, which is scope and not purpose; intent carried in prompts, chat, or memory, which is not durable, reviewable, or rankable, and is the tacit form this record replaces; issue trackers as the record of intent, which with the scrum-like workflows that operate on them are designed for humans with different requirements that do not fit this purpose; and the strongest form of the incumbent's framing, a graph that is a data structure the harness consumes, because it makes the harness the origin.

