<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="A view of the just-in-time reminder queue — what's due and how soon." />
    <title>Office Hours</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap"
    />
    <style>
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
      }
      #reminder-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .reminder {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.5rem 0;
        border-bottom: 1px solid var(--graphical-fg, rgba(255, 255, 255, 0.15));
      }
      .reminder-due {
        color: var(--muted-fg, #9aa0a6);
        white-space: nowrap;
      }
      .reminder-due.overdue {
        color: var(--danger, #ff6b6b);
        font-weight: 700;
      }
      .capacity-heading {
        font-size: 1rem;
        letter-spacing: 0.05em;
        color: var(--muted-fg, #9aa0a6);
        margin-bottom: 0.75rem;
      }
      .capacity-cards {
        display: flex;
        gap: 1rem;
        margin-bottom: 1rem;
      }
      .capacity-card {
        border: 1px solid var(--graphical-fg, rgba(255, 255, 255, 0.15));
        padding: 0.75rem 1rem;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .capacity-card-label {
        color: var(--muted-fg, #9aa0a6);
        font-size: 0.8rem;
      }
      .capacity-card-value {
        font-size: 1.75rem;
        font-weight: 700;
      }
      .capacity-resets {
        list-style: none;
        padding: 0;
        margin: 0 0 1rem 0;
      }
      .capacity-resets li {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.5rem 0;
        border-bottom: 1px solid var(--graphical-fg, rgba(255, 255, 255, 0.15));
      }
      .capacity-reset-label {
        flex: 0 0 7rem;
        min-width: 7rem;
        color: var(--muted-fg, #9aa0a6);
        font-size: 0.85rem;
      }
      .capacity-reset-clock {
        font-weight: 400;
        white-space: nowrap;
      }
      .capacity-reset-countdown {
        color: var(--muted-fg, #9aa0a6);
        white-space: nowrap;
      }
      .capacity-workers {
        margin: 0;
      }
      .capacity-worker-state {
        color: var(--muted-fg, #9aa0a6);
      }
      .capacity-worker-state.paused {
        color: var(--danger, #ff6b6b);
      }
      /* Plot tip text: force dark so it remains readable on every chart. */
      svg [aria-label="tip"] text { fill: #222; }
      .chart-layout {
        display: flex;
        align-items: stretch;
      }
      .chart-y-axis {
        flex-shrink: 0;
      }
      .chart-y-axis svg { display: block; height: auto; }
      .chart-scroll-wrapper {
        flex: 1;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
      }
      .chart-scroll-wrapper svg { height: auto; display: block; }
      .trend-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        padding: 0.25rem 0 0.5rem;
        font-size: 0.875rem;
      }
      .trend-legend-item {
        display: flex;
        align-items: center;
        gap: 0.375rem;
      }
      .legend-line {
        display: inline-block;
        width: 20px;
        height: 3px;
        border-radius: 1px;
        flex-shrink: 0;
      }
      .capacity-history {
        display: block;
        margin-top: 1.5rem;
      }
      .capacity-history-heading {
        font-size: 1rem;
        letter-spacing: 0.05em;
        color: var(--muted-fg, #9aa0a6);
        margin-bottom: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <h1>Office Hours</h1>
        <button id="auth-toggle" type="button">Sign in</button>
      </header>
      <main id="app"></main>
      <footer>
        <p>Created with <a href="https://github.com/natb1/commons.systems" target="_blank" rel="noopener">commons.systems</a> | &copy; 2026 RUMOR.ML <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener"><img src="https://mirrors.creativecommons.org/presskit/buttons/88x31/png/by-sa.png" alt="CC-BY-SA" class="cc-badge"></a></p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
