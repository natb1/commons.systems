<style>
  :root {

    --mast-h: 60px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #131922;
      --paper-2: #1A2230;
      --paper-3: #232D3D;
      --ink: #E6EAF0;
      --ink-2: #B8C2D0;
      --ink-3: #8794A6;
      --line: #33405288;
      --accent: #4FB3A8;
      --accent-ink: #7CD0C6;

      --delegated: #8FA0BA;
      --deferred: #D9A24A;
      --proposal: #D4776A;
      --ratified-soft: #1B3B39;
      --delegated-soft: #263145;
      --deferred-soft: #3D3018;
      --proposal-soft: #40231F;
      --stage-ruling: #D4776A;

      --stage-review: #8FA0BA;

      --stage-maieutic: #D9A24A;
      --stage-maieutic-soft: #3D3018;

    --ink: #E6EAF0;

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.55;

  }
  a { color: var(--accent-ink); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {

  .mono { font-family: var(--mono); }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- masthead ---------- */
  .mast { position: sticky; top: 0; z-index: 30; background: var(--paper); border-bottom: 1px solid var(--line); }
  .mast-in { max-width: 1200px; margin: 0 auto; padding: 10px 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
  .brand { display: flex; align-items: baseline; gap: 12px; flex: 1 1 auto; min-width: 0; }
  .wordmark { font-family: var(--serif); font-size: 21px; font-weight: 500; letter-spacing: -.01em; color: var(--ink); }
  .refline { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; }
  .tbtn {
    font: inherit; font-size: 13px; line-height: 1.3; font-family: var(--sans);
    background: none; border: 1px solid var(--line); border-radius: 4px;
    padding: 5px 9px; color: var(--ink-2); cursor: pointer; white-space: nowrap;
  }
  .tbtn:hover { background: var(--paper-2); color: var(--ink); }

  /* ---------- shell ---------- */
  .shell { max-width: 1200px; margin: 0 auto; padding: 0 22px 64px; display: grid; grid-template-columns: 1fr; align-items: start; gap: 0 44px; }
  main { min-width: 0; padding: 28px 0 0; }
  @media (min-width: 940px) {

      padding: 24px 6px 40px 0;
    }
  }
  .nav { padding: 18px 0 22px; border-bottom: 1px solid var(--line); }
  @media (min-width: 940px) { .nav { border-bottom: 0; } }

  /* ---------- page head ---------- */
  .pagehead { margin: 0 0 30px; }
  .counts { display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 0 0 18px; padding: 0 0 16px; border-bottom: 1px solid var(--line); }

  .counts dd { margin: 0; font-size: 17px; }
  .lede { font-family: var(--serif); font-size: 19px; line-height: 1.45; color: var(--ink-2); max-width: 38em; margin: 0; text-wrap: pretty; }

  /* ---------- nav rail ---------- */
  .grp { margin: 0 0 20px; }
  .grp-h { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; }
  .tree { list-style: none; margin: 0; padding: 0; }
  .tree li { margin: 0 0 1px; }
  .tree a {

    padding: 4px 6px; margin-left: -6px; border-radius: 3px;

  .mark { font-size: 12px; color: var(--accent-ink); text-align: right; }

  .pill { display: inline-block; font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; line-height: 1.5; vertical-align: middle; margin: 0 10px 4px 0; }
  .pill.stage-ruling { background: var(--stage-ruling-soft); color: var(--stage-ruling); }
  .pill.stage-review { background: var(--stage-review-soft); color: var(--stage-review); }
  .pill.stage-maieutic { background: var(--stage-maieutic-soft); color: var(--stage-maieutic); }
  .pill.stage-periagogic { background: var(--stage-periagogic-soft); color: var(--stage-periagogic); }

  .lbl { font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; }

  .mdbody p { margin: 0 0 12px; }
  .mdbody > :last-child { margin-bottom: 0; }
  .mdbody ul, .mdbody ol { margin: 0 0 12px; padding-left: 22px; }
  .mdbody li { margin: 0 0 5px; }
  .mdbody h3 { font-family: var(--serif); font-weight: 600; font-size: 17px; line-height: 1.3; margin: 18px 0 6px; }
  .mdbody h4, .mdbody h5, .mdbody h6 { font-family: var(--sans); font-weight: 600; font-size: 14px; margin: 14px 0 5px; }
  .mdbody blockquote { margin: 0 0 12px; padding: 2px 0 2px 14px; border-left: 2px solid var(--line); color: var(--ink-2); }
  .mdbody hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  .mdbody strong { font-weight: 600; }
  .mdbody em { font-style: italic; }

  pre { font-family: var(--mono); font-size: 12.5px; line-height: 1.5; background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; overflow-x: auto; margin: 0 0 12px; max-width: 100%; }
  pre code { background: none; padding: 0; font-size: inherit; }
  .none { color: var(--ink-3); font-style: italic; margin: 0; }

  .disposition { border-left: 2px solid var(--accent); padding-left: 14px; }
  .stands { border-left: 2px solid var(--line); padding-left: 14px; }
  .quoted { margin: 10px 0; padding: 10px 12px; background: var(--paper-2); border: 1px dashed var(--ink-3); border-radius: 4px; }
  .quoted .blk-label { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; }
  .quoted pre { margin: 0; }
  .account { padding: 14px 16px; background: var(--paper-2); border: 1px solid var(--line); border-radius: 4px; }

  /* ---------- the alternatives ---------- */
  .altlist { list-style: none; margin: 0; padding: 0; }
  .alt { margin: 0 0 14px; padding: 10px 0 0 14px; border-left: 2px solid var(--line); }
  .alt:last-child { margin-bottom: 0; }
  .alt.adopted { border-left-color: var(--accent-ink); }
  .altname { margin: 0 0 8px; font-size: 14px; }
  .altname .mono { font-family: var(--mono); font-size: 12.5px; color: var(--ink); margin-right: 10px; overflow-wrap: anywhere; }

  /* ---------- the draft and the edit ---------- */
  .draftsec { border-left: 2px solid var(--accent); padding-left: 14px; }
  .edit-lbl { margin-top: 18px; }
  .edit { background: var(--paper-2); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; overflow-x: auto; }
  .fmdiff { list-style: none; margin: 0 0 12px; padding: 0; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; }
  .fmdiff li { margin: 0 0 4px; overflow-wrap: anywhere; }
  .fmdiff .was { background: var(--del-soft); color: var(--del); padding: 0 4px; border-radius: 3px; }
  .fmdiff .now { background: var(--ins-soft); color: var(--ins); padding: 0 4px; border-radius: 3px; }
  .fmdiff .arrow { color: var(--ink-3); }
  .difflbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 12px 0 6px; }
  .edit > .difflbl:first-child, .edit > .fmdiff:first-child { margin-top: 0; }
  .diff { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15.5px; line-height: 1.6; margin: 0 0 4px; }
  ins { background: var(--ins-soft); color: var(--ins); text-decoration: none; border-radius: 2px; padding: 0 1px; box-shadow: inset 0 -1px 0 var(--ins); }
  del { background: var(--del-soft); color: var(--del); text-decoration: line-through; border-radius: 2px; padding: 0 1px; }
  .caption { font-size: 14px; color: var(--ink-3); font-style: italic; margin: 12px 0 0; }

  .shims { margin: 6px 0 0; padding-left: 20px; font-size: 14px; color: var(--ink-2); }
  .shims li { margin: 0 0 4px; }

  /* ---------- response ---------- */
  .response { margin: 20px 0 0; max-width: var(--measure); }
  .hint { font-size: 14px; color: var(--ink-2); background: var(--paper-2); border-left: 2px solid var(--ink-3); border-radius: 0 4px 4px 0; padding: 8px 12px; margin: 0 0 12px; }
  .controls { margin: 0; padding: 14px 16px; background: var(--paper-2); border: 1px solid var(--line); border-radius: 4px; }
  .controls[disabled] { opacity: .68; }
  .seg { display: flex; flex-wrap: wrap; gap: 0; margin: 4px 0 14px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--paper); width: fit-content; max-width: 100%; }
  .segopt { position: relative; display: block; }
  .segopt input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
  .segopt span { display: block; padding: 7px 14px; font-size: 14px; color: var(--ink-2); cursor: pointer; border-right: 1px solid var(--line); white-space: nowrap; }
  .segopt:last-child span { border-right: 0; }

  :root[data-theme="dark"] .segopt input:checked + span { color: #0F1720; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .segopt input:checked + span { color: #0F1720; } }
  .segopt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
  .note-lbl { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; }
  .note {
    display: block; width: 100%; font: inherit; font-size: 14.5px; font-family: var(--sans);
    background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 4px;
    padding: 8px 10px; resize: vertical;
  }
  .state { font-size: 13px; color: var(--ink-3); margin: 8px 0 0; }
  .state .linkish { font: inherit; background: none; border: 0; padding: 0; color: var(--accent-ink); text-decoration: underline; cursor: pointer; }

  /* ---------- sticky footer ---------- */
  .foot { position: sticky; bottom: 0; z-index: 28; background: var(--paper); border-top: 1px solid var(--line); box-shadow: 0 -6px 18px -14px rgba(0,0,0,.5); }
  .foot-in { max-width: 1200px; margin: 0 auto; padding: 12px 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
  .foot-count { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--ink-2); }
  .foot-note { font-size: 13px; color: var(--ink-3); flex: 1 1 auto; min-width: 0; }
  .sbtn {
    font: inherit; font-size: 14px; font-family: var(--sans); font-weight: 500;
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    border-radius: 4px; padding: 8px 16px; cursor: pointer; white-space: nowrap;
  }
  .sbtn[disabled] { background: none; color: var(--ink-3); border-color: var(--line); cursor: default; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  /* ================= the ruling screen =================================
   * commons.systems/disposition-graph/alignment-page: one node at a time,
   * three columns. The rail is fixed and narrow; the middle holds
   * everything the ruling asks; the right holds the rendered disposition
   * and nothing else, and takes the whole screen on demand.
   */
  .shell { max-width: 1680px; }
  @media (min-width: 940px) { .shell { grid-template-columns: minmax(230px, 288px) minmax(0, 1fr); gap: 0 36px; } }

  /* ---------- the metrics, at the top of the rail ---------- */
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin: 0 0 20px; padding: 0 0 16px; border-bottom: 1px solid var(--line); }
  .metric { display: block; padding: 6px 8px 7px; margin: 0; border-radius: 3px; text-decoration: none; color: inherit; }
  a.metric:hover { background: var(--paper-2); }
  .metric dt { font-family: var(--mono); font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 1px; }
  .metric dd { margin: 0; font-size: 19px; line-height: 1.1; color: var(--ink); }
  a.metric dt { text-decoration: underline dotted var(--line); text-underline-offset: 3px; }

  /* ---------- the rail ---------- */
  .tree { list-style: none; margin: 0; padding: 0; counter-reset: none; }
  .tree a { grid-template-columns: 10px minmax(0, 1fr) 14px; row-gap: 1px; }
  .tree a[aria-current="true"] { background: var(--accent-soft, var(--paper-3)); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent-ink); }
  .rmeta { grid-column: 2; font-size: 10.5px; letter-spacing: .04em; color: var(--ink-3); }

  /* ---------- one node, two columns ---------- */
  .item { border-top: 0; padding: 22px 0 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 36px; align-items: start; }
  /* Near enough evenly. The right-hand column was the widest while it held
     the node and the apparatus both; the author's refinement of 2026-09-04
     moved the apparatus to the middle, so a working column starved to a
     third would now be the worse failure. The disposition still takes the
     whole screen on demand (commons.systems/disposition-graph/alignment-page). */
  @media (min-width: 1240px) {
    .item { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); }
  }
  .shell.wide .item { grid-template-columns: minmax(0, 1fr); }
  .shell.wide .col-ask { display: none; }
  /* Widened, the column has the whole screen and prose would run to about
     130 characters a line without this. The button is for reading a long
     node, so the measure is what it is for. */
  .shell.wide .col-pane { max-width: 84ch; margin: 0 auto; }
  /* Nothing to render on the right: the item is one column and the one-line
     pane follows the asking column instead of sitting beside it in a half
     screen of white. */
  .item.nostand { grid-template-columns: minmax(0, 1fr) !important; }
  .item.nostand .col-pane { position: static; max-height: none; margin-top: 20px; }
  .col-ask, .col-pane { min-width: 0; }
  .col-pane { position: relative; }
  @media (min-width: 1240px) {
    .col-pane { position: sticky; top: calc(var(--mast-h) + 14px); max-height: calc(100vh - var(--mast-h) - 90px); overflow-y: auto; overscroll-behavior: contain; padding-right: 6px; }
  }
  .col-pane section { max-width: none; }
  .col-ask section { max-width: none; }

  /* ---------- the stage's own ask ---------- */
  /* The stage names the movement owed, so it heads the asking column. */
  .stagelead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 14px; }
  .stagehint { font-size: 13px; color: var(--ink-2); font-style: italic; }
  .locked { font-size: 12.5px; color: var(--ink-2); margin: 0 0 16px; padding: 8px 10px; border-left: 2px solid var(--line); background: var(--paper-2); }
  /* The stage, with the two routes into the dialogue embedded in it. */
  .chip { display: inline-flex; align-items: stretch; gap: 0; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; vertical-align: middle; }
  .chipname { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 9px; display: inline-flex; align-items: center; }
  .chipbtn { font-size: 12px; line-height: 1; padding: 3px 8px; border: 0; border-left: 1px solid var(--line); background: transparent; color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; text-decoration: none; }
  .chipbtn:hover { background: var(--paper-3); color: var(--ink); }
  .chipbtn.stub { color: var(--ink-3); }
  .chipbtn.stub::after { content: "\2217"; font-size: 9px; vertical-align: super; margin-left: 1px; }
  .foot-acts { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; }
  .sbtn.stub { text-decoration: none; display: inline-flex; align-items: center; gap: 4px; opacity: .72; }
  .nowords { font-size: 13px; color: var(--ink-2); font-style: italic; margin: 12px 0 0; }
  .controls .caption { margin: 8px 0 12px; }
  .controls .recline { margin: 6px 0 0; }
  .controls .persist, .controls .shims { font-size: 12.5px; color: var(--ink-3); }

  /* ---------- the decisions ---------- */
  .decisions { margin: 20px 0 0; }
  .decision { border: 1px solid var(--line); border-radius: 5px; padding: 12px 14px 10px; margin: 0 0 14px; }
  .declbl { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); padding: 0 6px; }
  .declbl .pill { margin-left: 8px; }
  .choices { list-style: none; margin: 6px 0 0; padding: 0; }
  .choice { margin: 0 0 4px; padding: 5px 6px; border-radius: 3px; }
  .choice.adopted { background: var(--paper-2); }
  .choice.reject { border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 9px; }
  .choicelbl { display: flex; align-items: baseline; gap: 8px; cursor: pointer; }
  .choicelbl input { flex: none; margin-top: 1px; }
  .choicename { font-size: 13.5px; color: var(--ink); overflow-wrap: anywhere; }
  /* What the choice would answer leads the row; its name follows as the
     handle the record files a ruling under, never in place of it. */
  .choicesays { font-size: 13.5px; color: var(--ink); }
  .choicename.handle { font-size: 11px; color: var(--ink-3); letter-spacing: .04em; white-space: nowrap; }
  .drill { margin: 4px 0 0 22px; }
  .drill summary { font-size: 12px; color: var(--ink-3); cursor: pointer; }
  .drill summary:hover { color: var(--ink-2); }
  .drill .mdbody { font-size: 13.5px; }
  .recline { margin: 10px 0 0; }
  .recline.none { color: var(--ink-3); font-size: 13px; }
  .pill.rec-bold-none { background: var(--paper-3); color: var(--ink-3); }
  .decwhy { font-size: 13px; color: var(--ink-2); margin: 6px 0 2px; }
  .dec-note { width: 100%; margin: 8px 0 2px; }
  .folded { font-size: 12.5px; color: var(--ink-3); margin: 10px 0 0; }
  .ruled { font-size: 12.5px; color: var(--ink-2); margin: 4px 0 0; }

  /* ---------- the indications ---------- */
  .indications { margin: 22px 0 0; }
  .indlist { list-style: none; margin: 8px 0 0; padding: 0; }
  .indlist li { display: grid; gap: 1px; padding: 6px 0; border-top: 1px solid var(--line); }
  .indq { font-size: 13.5px; color: var(--ink-2); }
  .indid { font-size: 10.5px; color: var(--ink-3); overflow-wrap: anywhere; }

  /* `display: grid` on .item beats the browser's own `[hidden]` rule, so
     the unselected nodes would stay visible without this. */
  [hidden] { display: none !important; }

  /* the pagehead is gone: it liquidated without a disposition */
  .pagehead, .counts, .lede, .graphgrp { display: none !important; }
</style>

<script>
"use strict";

var AL = { theme: "auto", db: null, staged: {}, submitted: {}, changing: {}, total: 0, rail: {}, selected: null, wide: false };

/* ------------------------------------------------------------- theme */

function alApplyTheme(mode) {
  AL.theme = mode;
  if (mode === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", mode);
  var btn = document.getElementById("btn-theme");
  if (btn) btn.textContent = "Theme: " + mode;
  try { window.localStorage.setItem("alignment-theme", mode); } catch (e) { /* storage unavailable */ }
}

/* ------------------------------------------------------- the record */

function alModule() {
  var el = document.getElementById("module-name");
  return (el && el.textContent) || "alignment";
}

function alStagedKey() { return "alignment-staged:" + alModule(); }
function alLocalKey() { return "alignment-responses:" + alModule(); }

function alReadJson(key) {
  try {
    var raw = window.localStorage.getItem(key);
    var v = raw ? JSON.parse(raw) : null;
    return v && typeof v === "object" ? v : {};
  } catch (e) {
    return {};
  }
}

function alWriteJson(key, value) {
  try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable */ }
}

function alItemEls() {
  return Array.prototype.slice.call(document.querySelectorAll("[data-item]"));
}

function alNotice(text) {
  var n = document.getElementById("notice");
  if (!n) return;
  n.textContent = text || "";
  n.hidden = !text;
}

function alFootNote(text) {
  var n = document.getElementById("foot-note");
  if (n) n.textContent = text || "";
}

/* ------------------------------------------------ reading the controls */

/* The whole-node control, and never a decision inside the same item. Both
   the decisions and this control are radios under the one `[data-item]`, so
   an unscoped `input[type="radio"]:checked` returned whichever came first in
   the document: with the decisions ahead of the control, choosing an
   alternative was read back as the node's own ruling and stored as
   `ruling: "<alternative name>"` on the response document, where `confirm`,
   `edit` or `deny` was meant. Scope every read and write of it to
   `[data-controls]`, which is the control's own fieldset and holds no
   decision. */
function alControlScope(el) {
  return el.querySelector("[data-controls]") || el;
}

function alReadControl(el) {
  var scope = alControlScope(el);
  var radio = scope.querySelector('input[type="radio"]:checked');
  var noteEl = scope.querySelector('[data-field="text"]');
  return { ruling: radio ? radio.value : null, text: noteEl ? noteEl.value : "" };
}

function alApplyControl(el, data) {
  if (!data) return;
  var scope = alControlScope(el);
  if (data.ruling) {
    var radio = scope.querySelector('input[type="radio"][value="' + String(data.ruling).replace(/["\\]/g, "\\$&") + '"]');
    if (radio) radio.checked = true;
  }
  var noteEl = scope.querySelector('[data-field="text"]');
  if (noteEl && typeof data.text === "string") noteEl.value = data.text;
}

// The textarea takes the label of whichever response is chosen -- a note,
// edits, or feedback -- so the author is never asked for one and writing
// another.
function alSyncNoteLabel(el) {
  var scope = alControlScope(el);
  var lbl = scope.querySelector("[data-note-lbl]");
  if (!lbl) return;
  var radio = scope.querySelector('input[type="radio"]:checked');
  lbl.textContent = radio
    ? (radio.getAttribute("data-note-label") || "A note, edits, or feedback")
    : "A note, edits, or feedback";
}

// A response counts when the author ruled on the whole node or on any one
// of the decisions it asks (commons.systems/disposition-graph/unanswered:
// the three responses are open on any subset at once).
function alHasResponse(r) {
  if (!r) return false;
  if (r.ruling || (typeof r.text === "string" && r.text.trim())) return true;
  return !!(r.decisions && Object.keys(r.decisions).length > 0);
}

function alWhen(iso) {
  try { return new Date(iso).toLocaleString(); } catch (e) { return String(iso || ""); }
}


/* ---------------------------------------------------- one at a time */

// The rail is the selector: one node is shown, the selection is marked
// there, and the address names it, so the author's place survives a reload
// (commons.systems/disposition-graph/alignment-page).
function alSelect(doc, push) {
  var items = alItemEls();
  var found = null;
  items.forEach(function (el) {
    var mine = el.getAttribute("data-doc") === doc;
    el.hidden = !mine;
    if (mine) found = el;
  });
  if (!found && items.length > 0) {
    found = items[0];
    doc = found.getAttribute("data-doc");
    found.hidden = false;
  }
  AL.selected = doc;
  Object.keys(AL.rail).forEach(function (d) {
    var a = AL.rail[d] ? AL.rail[d].parentNode : null;
    if (a) a.setAttribute("aria-current", d === doc ? "true" : "false");
  });
  if (push && doc) {
    try { history.replaceState(null, "", "#item-" + doc); } catch (e) { /* framed */ }
  }
  var main = document.getElementById("main");
  if (main && main.scrollIntoView) main.scrollIntoView({ block: "start" });
}

function alDocFromHash() {
  var h = String(window.location.hash || "");
  return h.indexOf("#item-") === 0 ? h.slice(6) : null;
}

/* ------------------------------------------- the per-decision rows */

function alReadDecisions(el) {
  var out = {};
  Array.prototype.slice.call(el.querySelectorAll("[data-decision]")).forEach(function (f) {
    var name = f.getAttribute("data-decision");
    var radio = f.querySelector('input[type="radio"]:checked');
    var note = f.querySelector("[data-decision-text]");
    var text = note ? note.value : "";
    if (!radio && !String(text).trim()) return;
    var value = radio ? radio.value : null;
    out[name] = value === "__reject"
      ? { ruling: "deny", choice: null, text: text }
      : { ruling: "confirm", choice: value, text: text };
  });
  return out;
}

function alApplyDecisions(el, decisions) {
  if (!decisions) return;
  Array.prototype.slice.call(el.querySelectorAll("[data-decision]")).forEach(function (f) {
    var d = decisions[f.getAttribute("data-decision")];
    if (!d) return;
    var value = d.ruling === "deny" ? "__reject" : d.choice;
    if (value) {
      var radio = f.querySelector('input[type="radio"][value="' + String(value).replace(/["\\]/g, "\\$&") + '"]');
      if (radio) radio.checked = true;
    }
    var note = f.querySelector("[data-decision-text]");
    if (note && typeof d.text === "string") note.value = d.text;
  });
}

// A rejection asks for feedback, so its box opens; a confirmation does not.
function alSyncDecisionNotes(el) {
  Array.prototype.slice.call(el.querySelectorAll("[data-decision]")).forEach(function (f) {
    var radio = f.querySelector('input[type="radio"]:checked');
    var note = f.querySelector("[data-decision-text]");
    if (!note) return;
    var wants = !!radio && radio.value === "__reject";
    note.hidden = !wants && !String(note.value).trim();
  });
}

/* ---------------------------------------------------------- rendering */

function alRenderItem(el) {
  var doc = el.getAttribute("data-doc");
  var staged = AL.staged[doc];
  var submitted = AL.submitted[doc];
  var state = el.querySelector("[data-state]");
  var controls = el.querySelector("[data-controls]");
  var mark = AL.rail[doc];

  // A node off the ruling stage takes no response at all, and its inputs
  // carry their own `disabled` from the render. An element's own disabled
  // attribute is never lifted by an ancestor fieldset, so the "change"
  // affordance below cannot work on one of these and is not offered: a
  // control that visibly does nothing is worse than none
  // (commons.systems/disposition-graph/alignment-page).
  var locked = el.getAttribute("data-stage") !== "ruling";

  // A submitted response is locked until the author asks to change it, and
  // stays open from then on -- clearing the box mid-edit must not lock it
  // again under the author's hands.
  if (controls) controls.disabled = locked || (!staged && !AL.changing[doc] && alHasResponse(submitted));
  if (mark) mark.textContent = staged ? "\u25CF" : alHasResponse(submitted) ? "\u2713" : "";

  if (!state) return;
  if (staged) {
    state.textContent = "Staged, not yet submitted.";
    state.hidden = false;
  } else if (alHasResponse(submitted)) {
    if (locked) {
      // Recorded while the node was at the ruling stage, and the dialogue has
      // since moved it back. The response stands in the record and is said so;
      // it cannot be changed here, because this node cannot take one at all.
      state.textContent = "Recorded " + alWhen(submitted.updated)
        + ", when this node was at the ruling stage. It has moved back since, so it takes no response here.";
    } else {
      state.textContent = "Submitted " + alWhen(submitted.updated) + " ";
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "linkish";
      btn.setAttribute("data-change", "");
      btn.textContent = "change";
      state.appendChild(btn);
    }
    state.hidden = false;
  } else {
    state.textContent = "";
    state.hidden = true;
  }
}

function alRender() {
  var n = Object.keys(AL.staged).length;
  var count = document.getElementById("staged-count");
  if (count) count.textContent = n + " response" + (n === 1 ? "" : "s") + " staged";
  var btn = document.getElementById("btn-submit");
  if (btn) {
    // Say what it does. "Submit" read as starting a session; it writes the
    // staged responses into this artifact's own record, where a session reads
    // them back (commons.systems/disposition-graph/ruling-transport).
    btn.textContent = "Record " + n + " for a session";
    btn.disabled = n === 0;
  }
  alItemEls().forEach(alRenderItem);
}

/* ------------------------------------------------------------ staging */

function alStage(el) {
  var doc = el.getAttribute("data-doc");
  var reading = alReadControl(el);
  alSyncNoteLabel(el);
  alSyncDecisionNotes(el);
  reading.decisions = alReadDecisions(el);
  if (!alHasResponse(reading)) delete AL.staged[doc];
  else AL.staged[doc] = {
    node: el.getAttribute("data-id"),
    stage: el.getAttribute("data-stage"),
    ruling: reading.ruling,
    text: reading.text,
    decisions: reading.decisions,
    updated: new Date().toISOString()
  };
  alWriteJson(alStagedKey(), AL.staged);
  alRender();
}

/* --------------------------------------------------------- submitting */

async function alSubmit() {
  var docs = Object.keys(AL.staged);
  if (docs.length === 0) return;
  var btn = document.getElementById("btn-submit");
  if (btn) btn.disabled = true;
  alNotice("");

  var failure = null;
  for (var i = 0; i < docs.length; i++) {
    var doc = docs[i];
    var data = AL.staged[doc];
    try {
      if (AL.db) await AL.db.doc("responses/" + doc).set(data);
      AL.submitted[doc] = data;
      delete AL.staged[doc];
      delete AL.changing[doc];
    } catch (e) {
      failure = e;
      break;
    }
  }

  alWriteJson(alStagedKey(), AL.staged);
  if (!AL.db) alWriteJson(alLocalKey(), AL.submitted);

  if (AL.db) {
    try {
      var snap = await AL.db.collection("responses").get();
      await AL.db.doc("meta/status").set({
        answered: snap.docs.length,
        total: AL.total,
        at: new Date().toISOString()
      });
    } catch (e) { /* the status document is best-effort */ }
  }

  if (failure) alFootNote(failure && failure.message ? failure.message : "The record refused the write.");
  else if (AL.db) alFootNote("");
  alRender();
}

/* ------------------------------------------------------------- digest */

/* One instruction, whichever route carries it. The copy control and the
   launch link must never emit different text: two controls claiming to do the
   same thing and saying different things is the defect this exists to prevent
   (commons.systems/disposition-graph/ruling-transport). The launch link
   carries the bare `/align`, because a whole sitting does not fit in a URL,
   and this is what the author pastes. */
function alInstructionAll() {
  var mod = document.getElementById("module-name");
  var lines = ["/align", ""];
  var n = 0;
  alItemEls().forEach(function (el) {
    var doc = el.getAttribute("data-doc");
    var staged = AL.staged[doc];
    var r = staged || AL.submitted[doc];
    if (!alHasResponse(r)) return;
    n++;
  });
  if (n === 0) {
    lines.push("I have ruled on nothing yet on the alignment page"
      + (mod && mod.textContent ? " for " + mod.textContent : "") + ".");
    return lines.join("\n");
  }
  lines.push("I have ruled on " + n + (n === 1 ? " node" : " nodes")
    + " on the alignment page"
    + (mod && mod.textContent ? " for " + mod.textContent : "")
    + ". Act on every response below before anything else, as the skill's step 0.4 says,"
    + " then resume each sitting at its stage. Each response names the node, the stage it"
    + " was at when I ruled, my ruling on the whole, and my ruling on any decision within it.");
  lines.push("");
  alItemEls().forEach(function (el) {
    var doc = el.getAttribute("data-doc");
    var staged = AL.staged[doc];
    var r = staged || AL.submitted[doc];
    if (!alHasResponse(r)) return;
    lines.push(
      el.getAttribute("data-id")
      + " [" + el.getAttribute("data-stage") + "] "
      + (r.ruling || "no ruling on the whole")
      + (staged ? " (staged, not recorded)" : " (recorded)")
    );
    var text = (r.text || "").trim();
    if (text) lines.push("  " + text);
    var decisions = r.decisions || {};
    Object.keys(decisions).forEach(function (name) {
      var d = decisions[name] || {};
      lines.push("  " + name + ": " + (d.ruling || "no ruling")
        + (d.choice ? " " + d.choice : "")
        + (String(d.text || "").trim() ? " -- " + String(d.text).trim() : ""));
    });
    lines.push("");
  });
  return lines.join("\n");
}

/* Put text on the clipboard and say so on the button that asked for it. */
function alCopyText(text, btn, label) {
  var done = function () {
    if (!btn) return;
    var old = btn.textContent;
    btn.textContent = label || "Copied";
    window.setTimeout(function () { btn.textContent = old; }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { alNotice("Could not reach the clipboard."); });
  } else {
    alNotice("The clipboard is unavailable in this view.");
  }
}

function alCopyAll() {
  alCopyText(alInstructionAll(), document.getElementById("btn-copy"), "Copied");
}

/* --------------------------------------------------------------- boot */

async function alBoot() {
  try {
    var saved = window.localStorage.getItem("alignment-theme");
    if (saved === "light" || saved === "dark" || saved === "auto") AL.theme = saved;
  } catch (e) { /* storage unavailable */ }
  alApplyTheme(AL.theme);

  Array.prototype.slice.call(document.querySelectorAll("[data-rail]")).forEach(function (a) {
    AL.rail[a.getAttribute("data-doc")] = a.querySelector("[data-mark]");
  });

  var items = alItemEls();
  AL.total = items.length;
  AL.staged = alReadJson(alStagedKey());

  try {
    AL.db = (window.claude && typeof window.claude.use === "function") ? await window.claude.use("db") : null;
  } catch (e) {
    AL.db = null;
  }

  if (AL.db) {
    try {
      var snap = await AL.db.collection("responses").get();
      snap.docs.forEach(function (d) { AL.submitted[d.id] = d.data(); });
    } catch (e) {
      AL.submitted = alReadJson(alLocalKey());
      alFootNote("The shared record could not be read; showing what this browser holds.");
    }
  } else {
    AL.submitted = alReadJson(alLocalKey());
    alFootNote("No shared record in this view: responses are kept in this browser only.");
  }

  items.forEach(function (el) {
    var doc = el.getAttribute("data-doc");
    // A staged response is the later of the two, and stands whole: it is
    // what the author has written since the last submission.
    alApplyControl(el, AL.staged[doc] || AL.submitted[doc]);
    alApplyDecisions(el, (AL.staged[doc] || AL.submitted[doc] || {}).decisions);
    alSyncNoteLabel(el);
    alSyncDecisionNotes(el);
    el.addEventListener("change", function () { alStage(el); });
    el.addEventListener("input", function () { alStage(el); });
    el.addEventListener("click", function (ev) {
      var t = ev.target;
      if (!t || !t.hasAttribute || !t.hasAttribute("data-change")) return;
      // Never reachable from a locked item, which renders no change button;
      // guarded anyway, since opening the fieldset there would suggest an
      // edit the individually-disabled inputs cannot accept.
      if (el.getAttribute("data-stage") !== "ruling") return;
      AL.changing[doc] = true;
      var controls = el.querySelector("[data-controls]");
      if (controls) controls.disabled = false;
      alStage(el);
      var note = el.querySelector('[data-field="text"]');
      if (note) note.focus();
    });
  });

  var submitBtn = document.getElementById("btn-submit");
  if (submitBtn) submitBtn.addEventListener("click", alSubmit);

  var themeBtn = document.getElementById("btn-theme");
  if (themeBtn) themeBtn.addEventListener("click", function () {
    alApplyTheme(AL.theme === "auto" ? "light" : AL.theme === "light" ? "dark" : "auto");
  });

  var copyBtn = document.getElementById("btn-copy");
  if (copyBtn) copyBtn.addEventListener("click", alCopyAll);

  /* The per-node copy on every stage chip: the instruction that opens the
     dialogue on that node, the same text its launch link carries. Delegated
     from the document so one listener serves all of them. */
  document.addEventListener("click", function (ev) {
    var btn = ev.target && ev.target.closest ? ev.target.closest("[data-copy]") : null;
    if (!btn) return;
    ev.preventDefault();
    alCopyText(btn.getAttribute("data-copy"), btn, "\u2713");
  });

  // The rail selects; the node in view takes the whole screen on demand,
  // because a whole node's text in a third of a screen is skimmed and the
  // author rules on what they read.
  Array.prototype.slice.call(document.querySelectorAll("[data-rail]")).forEach(function (a) {
    a.addEventListener("click", function (ev) {
      ev.preventDefault();
      alSelect(a.getAttribute("data-doc"), true);
    });
  });
  window.addEventListener("hashchange", function () {
    var d = alDocFromHash();
    if (d && d !== AL.selected) alSelect(d, false);
  });

  var wideBtn = document.getElementById("btn-wide");
  if (wideBtn) wideBtn.addEventListener("click", function () {
    AL.wide = !AL.wide;
    var shell = document.querySelector(".shell");
    if (shell) shell.classList.toggle("wide", AL.wide);
    wideBtn.setAttribute("aria-pressed", AL.wide ? "true" : "false");
    wideBtn.textContent = AL.wide ? "Show what it asks" : "Widen the node";
  });

  alSelect(alDocFromHash() || (items[0] ? items[0].getAttribute("data-doc") : null), false);
  alRender();
}

if (typeof document !== "undefined") alBoot();
</script>
