<title>Disposition Graph</title>

<style>

  /* ---------- prose bodies ---------- */
  .mdbody { max-width: var(--measure); }
  .mdbody p { margin: 0 0 15px; }
  .mdbody > :last-child { margin-bottom: 0; }
  .mdbody ul, .mdbody ol { margin: 0 0 15px; padding-left: 22px; }

  .mdbody h4, .mdbody h5, .mdbody h6 { font-family: var(--sans); font-weight: 600; font-size: 15px; margin: 20px 0 6px; }

  .alts > .blk-label { font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
  .altlist { list-style: none; margin: 0; padding: 0; }
  .altlist > li { margin: 0 0 14px; padding-left: 14px; border-left: 2px solid var(--line); }
  .altlist > li:last-child { margin-bottom: 0; }
  .altname { margin: 0 0 6px; font-size: 14px; }
  .altname .mono { font-family: var(--mono); font-size: 12.5px; color: var(--ink); margin-right: 10px; overflow-wrap: anywhere; }
  .altmeta { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; color: var(--ink-3); overflow-wrap: anywhere; }
  .alts .mdbody { font-size: 15px; }
  .altnote { font-size: 13.5px; line-height: 1.45; color: var(--ink-3); margin: 12px 0 0; }
  .pill.prune { background: var(--proposal-soft); color: var(--proposal); }
  .instr { padding: 2px 0 2px 16px; border-left: 2px solid var(--accent); max-width: var(--measure); }
  .instr .kind { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-ink); margin: 0 0 5px; }

  .instr .note { font-size: 15px; color: var(--ink-2); margin: 0; }

  /* ---------- traditions ---------- */
  .readings { display: grid; gap: 24px; max-width: var(--measure); }
  .reading { padding: 2px 0 2px 18px; border-left: 2px solid var(--line); }
  .reading .rhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin: 0 0 8px; }
  .badge { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; border: 1px solid; }

  .reading .rq2 { font-family: var(--serif); font-weight: 500; font-size: 18px; line-height: 1.3; margin: 0 0 8px; text-wrap: balance; }
  .reading .rq2 a { color: var(--ink); text-decoration: none; }
  .reading .rq2 a:hover { color: var(--accent-ink); text-decoration: underline; }
  .reading .src { font-family: var(--serif); font-style: italic; font-size: 15px; line-height: 1.45; color: var(--ink-2); margin: 0 0 10px; }
  .reading .stamp { font-family: var(--mono); font-size: 11px; letter-spacing: .05em; color: var(--ink-3); margin: 0 0 10px; }
  .reading .mdbody { font-size: 16px; }
  .reading .more { font-size: 13.5px; margin: 10px 0 0; }
  .reading.solo { max-width: var(--measure); }
  .reading.solo .src { font-size: 16px; margin: 0; }

  /* ---------- refinements ---------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 12px; }
  .card { display: block; padding: 13px 15px; background: var(--paper-2); border: 1px solid var(--line); border-radius: 4px; text-decoration: none; color: var(--ink); }
  .card:hover { border-color: var(--accent); }
  .card .cq { font-family: var(--serif); font-weight: 500; font-size: 17px; line-height: 1.25; margin: 0 0 10px; text-wrap: balance; }
  .card .cmeta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }

  /* ---------- cites ---------- */
  .cites { list-style: none; margin: 0; padding: 0; max-width: var(--measure); }
  .cites li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .cites li:first-child { border-top: 0; }
  .cites .hash { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }

  /* ---------- vocabulary ---------- */
  /* Defined terms are dense in this record, so the resting mark is quiet and
     the accent only appears on hover or focus. */
  .dfn { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--ink-3); cursor: help; }
  .dfn:hover, .dfn:focus-visible { color: var(--accent-ink); border-bottom-color: var(--accent); border-bottom-style: solid; }
  .tip { position: fixed; z-index: 60; max-width: 320px; padding: 10px 12px; background: var(--paper-2); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; box-shadow: var(--shadow); font-size: 13.5px; line-height: 1.45; pointer-events: none; }
  .tip .tq { display: block; font-family: var(--serif); font-size: 15px; line-height: 1.3; margin-bottom: 5px; }
  .tip .ta { display: block; color: var(--ink-2); }

  .lede { font-family: var(--serif); font-size: 19px; line-height: 1.4; color: var(--ink-2); max-width: 34em; margin: 0 0 26px; text-wrap: balance; }
  .empty { color: var(--ink-3); font-size: 15px; }
  .unknown { color: var(--ink-3); }

  /* ---------- footer ---------- */
  .foot { max-width: 1200px; margin: 0 auto; padding: 20px 22px 40px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 11px; letter-spacing: .06em; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 6px 20px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

<script>
"use strict";

var DG = {
  data: null,
  byId: new Map(),
  groups: [],
  terms: [],
  termMap: new Map(),
  route: null,
  theme: "auto"
};

/* ------------------------------------------------------------------ *
 * text and markdown
 * ------------------------------------------------------------------ */

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return c === "&" ? "&amp;" : c === "<" ? "&lt;" : c === ">" ? "&gt;" : "&quot;";
  });
}

function safeHref(h) {
  var s = String(h).trim();
  if (!s) return null;
  if (/^(https?:|mailto:)/i.test(s)) return s;
  if (/^[a-z][a-z0-9+.\-]*:/i.test(s)) return null;
  return s;
}

function marks(t) {
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, label, href) {
    var safe = safeHref(href);
    if (!safe) return m;
    var ext = /^https?:/i.test(safe);
    return '<a href="' + safe + '"' + (ext ? ' target="_blank" rel="noreferrer noopener"' : "") + ">" + label + "</a>";
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|[\s(\["])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  t = t.replace(/(^|[\s(\["])_([^_\s][^_]*)_/g, "$1<em>$2</em>");
  return t;
}

function inline(s) {
  return String(s == null ? "" : s).split(/(`[^`]*`)/g).map(function (p) {
    if (p.length > 1 && p.charAt(0) === "`" && p.charAt(p.length - 1) === "`") {
      return "<code>" + esc(p.slice(1, -1)) + "</code>";
    }
    return marks(esc(p));
  }).join("");
}

var RE_BULLET = /^\s*([-*+])\s+(.*)$/;
var RE_ORDER = /^\s*(\d+)[.)]\s+(.*)$/;
var RE_BREAK = /^\s*(?:#{1,6}\s|```|>|[-*+]\s|\d+[.)]\s)/;
var RE_RULE = /^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/;

function mdBlocks(src) {
  var out = [];
  if (src == null || String(src).trim() === "") return out;
  var lines = String(src).replace(/\r\n?/g, "\n").split("\n");
  var i = 0;
  while (i < lines.length) {
    var line = lines[i];
    if (!line.trim()) { i++; continue; }
    var fence = line.match(/^\s*```(\S*)\s*$/);
    if (fence) {
      var code = [];
      i++;
      while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { code.push(lines[i]); i++; }
      i++;
      out.push({ type: "code", text: "", html: "<pre><code>" + esc(code.join("\n")) + "</code></pre>" });
      continue;
    }
    if (RE_RULE.test(line)) { out.push({ type: "rule", text: "", html: "<hr>" }); i++; continue; }
    var head = line.match(/^\s*(#{1,6})\s+(.*)$/);
    if (head) {
      var lvl = Math.max(3, Math.min(6, head[1].length));
      var text = head[2].trim().replace(/\s+#+\s*$/, "");
      out.push({ type: "heading", level: head[1].length, text: text, html: "<h" + lvl + ">" + inline(text) + "</h" + lvl + ">" });
      i++;
      continue;
    }
    if (/^\s*>/.test(line)) {
      var quoted = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { quoted.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      out.push({ type: "quote", text: quoted.join(" "), html: "<blockquote>" + mdHtml(quoted.join("\n")) + "</blockquote>" });
      continue;
    }
    if (RE_BULLET.test(line) || RE_ORDER.test(line)) {
      var ordered = !RE_BULLET.test(line);
      var re = ordered ? RE_ORDER : RE_BULLET;
      var items = [];
      while (i < lines.length) {
        var m = lines[i].match(re);
        if (m) { items.push(m[2]); i++; }
        else if (items.length && lines[i].trim() && /^\s{2,}\S/.test(lines[i])) { items[items.length - 1] += " " + lines[i].trim(); i++; }
        else break;
      }
      var tag = ordered ? "ol" : "ul";
      out.push({
        type: "list",
        text: items.join(" "),
        html: "<" + tag + ">" + items.map(function (t) { return "<li>" + inline(t) + "</li>"; }).join("") + "</" + tag + ">"
      });
      continue;
    }
    var para = [];
    while (i < lines.length && lines[i].trim() && !RE_BREAK.test(lines[i]) && !RE_RULE.test(lines[i])) {
      para.push(lines[i].trim());
      i++;
    }
    if (!para.length) { i++; continue; }
    out.push({ type: "para", text: para.join(" "), html: "<p>" + inline(para.join(" ")) + "</p>" });
  }
  return out;
}

function mdHtml(src) {
  return mdBlocks(src).map(function (b) { return b.html; }).join("");
}

/* Wrap a "### Rejected" run in its own labelled block. */
function groupRejected(blocks) {
  var out = [];
  var i = 0;
  while (i < blocks.length) {
    var b = blocks[i];
    if (b.type === "heading" && /^rejected\b/i.test(b.text)) {
      var level = b.level;
      var inner = [];
      i++;
      while (i < blocks.length && !(blocks[i].type === "heading" && blocks[i].level <= level)) {
        inner.push(blocks[i].html);
        i++;
      }
      out.push('<section class="rejected"><h3 class="blk-label">' + esc(b.text) + "</h3>" + inner.join("") + "</section>");
      continue;
    }
    out.push(b.html);
    i++;
  }
  return out.join("");
}

/* Plain text of one markdown line, for tooltips and sentences. */
function plain(s) {
  return String(s == null ? "" : s)
    .replace(/`([^`]*)`/g, "$1")
    .replace(/\[([^\]]+)\]\([^)\s]+\)/g, "$1")
    .replace(/\*\*([^*]+)\*\*/g, "$1")
    .replace(/\*([^*]+)\*/g, "$1")
    .replace(/(^|\s)_([^_]+)_/g, "$1$2")
    .replace(/\s+/g, " ")
    .trim();
}

/* The opening sentence of an answer, used as the gloss on a defined term.
   A very short opener ("I am.") says nothing on its own, so it carries the
   next sentence with it; a runaway one is cut. */
function firstSentence(md) {
  var blocks = mdBlocks(md);
  var first = null;
  for (var i = 0; i < blocks.length; i++) {
    if (blocks[i].type === "para" || blocks[i].type === "list" || blocks[i].type === "quote") { first = blocks[i]; break; }
  }
  if (!first) return "";
  var rest = plain(first.text);
  var out = "";
  for (var k = 0; k < 2 && rest; k++) {
    var m = rest.match(/^[\s\S]*?[.!?](?=\s|$)/);
    var take = m ? m[0] : rest;
    out = out ? out + " " + take : take;
    rest = rest.slice(take.length).replace(/^\s+/, "");
    if (out.length >= 30) break;
  }
  return out.length > 240 ? out.slice(0, 239).replace(/\s+\S*$/, "") + "…" : out;
}

function truncate(s, n) {
  var t = String(s == null ? "" : s);
  return t.length > n ? t.slice(0, n - 1).replace(/[\s,;:]+$/, "") + "…" : t;
}

/* ------------------------------------------------------------------ *
 * record vocabulary
 * ------------------------------------------------------------------ */

function reEsc(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

function termIndex(nodes) {
  var map = new Map();
  var terms = [];
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    var defs = n.defines || [];
    for (var j = 0; j < defs.length; j++) {
      var raw = String(defs[j]).trim();
      if (!raw) continue;
      var key = raw.toLowerCase();
      if (map.has(key)) continue;
      map.set(key, { term: raw, id: n.id, question: n.question, sentence: firstSentence(n.answer) });
      terms.push(raw);
    }
  }
  terms.sort(function (a, b) { return b.length - a.length; });
  return { map: map, terms: terms };
}

function termRegex(terms) {
  if (!terms.length) return null;
  var body = terms.map(reEsc).join("|");
  try {
    return new RegExp("(?<![\\p{L}\\p{N}_])(" + body + ")(?![\\p{L}\\p{N}_])", "giu");
  } catch (e) {
    return new RegExp("\\b(" + body + ")\\b", "gi");
  }
}

var SKIP_TAGS = { CODE: 1, PRE: 1, A: 1, DFN: 1, BUTTON: 1 };

function linkTerms(root, selfId) {
  if (!DG.terms.length) return;
  var bodies = root.querySelectorAll(".mdbody");
  for (var b = 0; b < bodies.length; b++) {
    var used = Object.create(null);
    var texts = [];
    var walker = document.createTreeWalker(bodies[b], NodeFilter.SHOW_TEXT, null);
    var t;
    while ((t = walker.nextNode())) {
      var skip = false;
      for (var p = t.parentNode; p && p !== bodies[b]; p = p.parentNode) {
        if (SKIP_TAGS[p.nodeName]) { skip = true; break; }
      }
      if (!skip && t.nodeValue.trim()) texts.push(t);
    }
    for (var k = 0; k < texts.length; k++) linkTextNode(texts[k], used, selfId);
  }
}

function linkTextNode(node, used, selfId) {
  var re = termRegex(DG.terms);
  if (!re) return;
  var text = node.nodeValue;
  var frag = null;
  var last = 0;
  var m;
  while ((m = re.exec(text))) {
    var key = m[0].toLowerCase();
    var def = DG.termMap.get(key);
    if (!def || used[key] || def.id === selfId) continue;
    used[key] = 1;
    if (!frag) frag = document.createDocumentFragment();
    if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    var a = document.createElement("a");
    a.className = "dfn";
    a.href = "#" + def.id;
    a.setAttribute("data-term", key);
    a.textContent = m[0];
    frag.appendChild(a);
    last = m.index + m[0].length;
  }
  if (frag) {
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
}

/* ------------------------------------------------------------------ *
 * record vocabulary of the projection itself
 * ------------------------------------------------------------------ */

var FORM_WORD = { target: "target", rule: "rule", assumption: "assumption", arche: "archē", reading: "reading" };
var FORM_MARK = { target: "tgt", rule: "rule", assumption: "asm", arche: "arch", reading: "rdg" };
// Only the three stamp classes now: `status` (answered/unanswered, see
// derive.mjs's deriveStatus) is no longer a per-node word painted through
// this map -- an unanswered node gets its own "unanswered · <stage>" pill
// (unansweredPill, below) instead of a repurposed status color.
var STATUS_CLASS = { ratified: "rat", delegated: "del", deferred: "def" };
var STATUS_WORD = { ratified: "ratified", delegated: "delegated", deferred: "deferred" };

function formWord(f) { return FORM_WORD[f] || (f ? String(f) : "unanswered"); }
function formMark(f) { return FORM_MARK[f] || "··"; }

function fmtPct(r) {
  if (r == null || isNaN(r)) return "—";
  var p = Number(r) * 100;
  return (p >= 10 ? p.toFixed(0) : p.toFixed(1)) + "%";
}

function pill(status, small) {
  return '<span class="pill' + (small ? " sm" : "") + " " + (STATUS_CLASS[status] || "none") + '">' +
    esc(STATUS_WORD[status] || status) + "</span>";
}

/* The stamp pill a node's own page and the nav/cards show: the authority
   class when there is one, "unstamped" (neutral) when there is not -- a
   node with neither is a no-answer node, hidden from the browser entirely
   (excludeUnaligned), so this never has to render "no answer yet" for real
   embedded data. */
function stampPill(n, small) {
  if (n.authority && n.authority.class) return pill(n.authority.class, small);
  return pill("unstamped", small);
}

/* What a node in the dialogue adds beside its stamp: which stage it is at.
   An unanswered node says so and names the stage; an answered node -- one
   whose standing answer holds while a dialogue runs on it anyway -- names
   the stage alone, since "unanswered" would misdescribe it. Reuses the same
   `.pill` look (the "deferred" color, since a deferred stamp is itself
   always unanswered) rather than a bespoke color, so it already carries
   both themes. */
function unansweredPill(n, small) {
  var label;
  if (n.status === "unanswered") label = "unanswered" + (n.stage ? " · " + n.stage : "");
  else if (n.stage) label = "in dialogue · " + n.stage;
  else return "";
  return '<span class="pill unans' + (small ? " sm" : "") + '">' + esc(label) + "</span>";
}

/* The browser never renders a recommended text (that is the alignment
   page's job); a node that carries one just says so, once, beside its
   stamp. */
function draftNoteHtml(n) {
  if (!n.draft) return "";
  return '<p class="draftnote">' + "A recommendation awaits the author's ruling on the alignment page." + "</p>";
}

/* The answers on the table beside the one the node stands on, listed under
   the stamp with the one line that says what they do and do not do: the
   standing answer keeps its authority until the author confirms one of
   them. Each carries its name, where it came from (`source`, and the `ref`
   that dates it or names the instrument that raised it), whether it would
   prune the node rather than rewrite it, and its prose from the node's
   `## Alternatives` section. Nothing is rendered for a node with none. */
function alternativesHtml(n) {
  var alts = n.alternatives || [];
  if (!alts.length) return "";
  var text = n.alternativesText || {};
  var items = alts.map(function (a) {
    var meta = [a.source];
    if (a.ref) meta.push(a.ref);
    return "<li>" +
      '<p class="altname"><span class="mono">' + esc(a.name) + "</span>" +
      (a.prune ? '<span class="pill sm prune">prune</span>' : "") +
      '<span class="altmeta">' + esc(meta.join(" · ")) + "</span></p>" +
      (text[a.name] ? '<div class="mdbody">' + mdHtml(text[a.name]) + "</div>" : "") +
      "</li>";
  }).join("");
  return '<div class="alts"><p class="blk-label">Pending alternatives</p>' +
    '<ul class="altlist">' + items + "</ul>" +
    '<p class="altnote">' +
    "The standing answer keeps its authority until the author confirms one of these." +
    "</p></div>";
}

/* ------------------------------------------------------------------ *
 * indexing
 * ------------------------------------------------------------------ */

function byRank(a, b) {
  var ra = a.rank == null ? -1 : a.rank;
  var rb = b.rank == null ? -1 : b.rank;
  if (rb !== ra) return rb - ra;
  return String(a.question || a.id).localeCompare(String(b.question || b.id));
}

function index() {
  var nodes = DG.data.nodes || [];
  for (var i = 0; i < nodes.length; i++) DG.byId.set(nodes[i].id, nodes[i]);

  var vocab = termIndex(nodes.slice().sort(byRank));
  DG.terms = vocab.terms;
  DG.termMap = vocab.map;

  // Group by graph. A node opens a group when no parent of it sits in the
  // same graph, so every graph shows its own tree under its own label.
  var groups = new Map();
  for (i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    var g = n.graph || "";
    if (!groups.has(g)) groups.set(g, { name: g, about: "", target: null, roots: [] });
    var parents = (n.under || []).filter(function (id) {
      var p = DG.byId.get(id);
      return p && p.graph === n.graph;
    });
    if (!parents.length) groups.get(g).roots.push(n);
  }
  var meta = DG.data.graphs || {};
  groups.forEach(function (grp, name) {
    var m = meta[name] || {};
    grp.about = m.about || name;
    grp.target = m.target || null;
    grp.roots.sort(byRank);
  });
  DG.groups = Array.from(groups.values()).sort(function (a, b) {
    var ra = a.roots.length ? (a.roots[0].rank || 0) : -1;
    var rb = b.roots.length ? (b.roots[0].rank || 0) : -1;
    return rb - ra;
  });
}

function childrenOf(n) {
  return (n.children || [])
    .map(function (id) { return DG.byId.get(id); })
    .filter(Boolean)
    .sort(byRank);
}

/* The nav tree stays inside one graph: a child in another graph is a root of
   that graph's own group, so it is listed there instead of twice. */
function childrenInGraph(n) {
  return childrenOf(n).filter(function (c) { return c.graph === n.graph; });
}

function defaultNode() {
  var nodes = (DG.data.nodes || []).slice().sort(byRank);
  var preferred = nodes.filter(function (n) { return n.graph === "disposition-graph"; });
  return (preferred[0] || nodes[0] || null);
}

/* ------------------------------------------------------------------ *
 * navigation pane
 * ------------------------------------------------------------------ */

function rowHtml(n, current) {
  return '<a class="row" href="#' + esc(n.id) + '"' + (n.id === current ? ' aria-current="page"' : "") +
    ' title="' + esc(n.question || n.id) + '">' +
    '<span class="rq">' + esc(n.question || n.id) + "</span>" +
    '<span class="rf" title="' + esc(formWord(n.form)) + '">' + esc(formMark(n.form)) + "</span>" +
    stampPill(n, true) + unansweredPill(n, true) + "</a>";
}

function treeHtml(nodes, current, path, budget) {
  if (!nodes.length || path.length > 12) return "";
  var out = ["<ul>"];
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    if (budget.left <= 0) break;
    budget.left--;
    if (path.indexOf(n.id) !== -1) {
      out.push("<li>" + rowHtml(n, current) + "</li>");
      continue;
    }
    out.push("<li>" + rowHtml(n, current) + treeHtml(childrenInGraph(n), current, path.concat([n.id]), budget) + "</li>");
  }
  out.push("</ul>");
  return out.join("");
}

function renderTree(query) {
  var host = document.getElementById("tree");
  var current = DG.route && DG.route.kind === "node" ? DG.route.id : null;
  var q = String(query || "").trim().toLowerCase();

  if (q) {
    var hits = (DG.data.nodes || []).filter(function (n) {
      return String(n.question || "").toLowerCase().indexOf(q) !== -1 ||
        String(n.id || "").toLowerCase().indexOf(q) !== -1;
    }).sort(byRank);
    var body = hits.length
      ? '<ul class="tree">' + hits.map(function (n) { return "<li>" + rowHtml(n, current) + "</li>"; }).join("") + "</ul>"
      : '<p class="searchnote">No question matches.</p>';
    host.innerHTML = '<p class="searchnote">' + hits.length + " of " + (DG.data.nodes || []).length + " questions</p>" + body;
    return;
  }

  var budget = { left: 2000 };
  var parts = [];
  for (var i = 0; i < DG.groups.length; i++) {
    var g = DG.groups[i];
    if (!g.roots.length) continue;
    parts.push('<section class="grp">');
    parts.push('<p class="grp-h">' + esc(g.name) + "</p>");
    parts.push('<p class="grp-about">' + esc(g.about) + "</p>");
    parts.push('<div class="tree" aria-label="' + esc(g.about) + '">' + treeHtml(g.roots, current, [], budget) + "</div>");
    parts.push("</section>");
  }
  host.innerHTML = parts.join("");

  var cur = host.querySelector('[aria-current="page"]');
  if (cur && window.innerWidth >= 940) cur.scrollIntoView({ block: "nearest", inline: "nearest" });
}

/* ------------------------------------------------------------------ *
 * node page
 * ------------------------------------------------------------------ */

function nodeLink(id, cls) {
  var n = DG.byId.get(id);
  if (!n) return '<span class="unknown mono">' + esc(id) + "</span>";
  return '<a' + (cls ? ' class="' + cls + '"' : "") + ' href="#' + esc(n.id) + '">' + esc(truncate(n.question || n.id, 72)) + "</a>";
}

function fact(k, v, dtTitle) {
  var t = dtTitle ? ' title="' + esc(dtTitle) + '"' : "";
  return "<div><dt" + t + ">" + esc(k) + "</dt><dd>" + v + "</dd></div>";
}

function authorityHtml(n) {
  var a = n.authority;
  var html;
  if (a && a.class) {
    var stamp = [];
    if (a.by) stamp.push("by " + a.by);
    if (a.date) stamp.push(a.date);
    html = pill(a.class) + (stamp.length ? '<span class="stamp">' + esc(stamp.join(" · ")) + "</span>" : "");
  } else if (n.answer) {
    html = pill("unstamped") + '<span class="stamp">no authority</span>';
  } else {
    html = pill("question") + '<span class="stamp">no answer yet</span>';
  }
  return html + unansweredPill(n);
}

/* One line per shim: what it is, what it is for (when recorded), what
   liquidates it, and when it was declared. */
function shimsHtml(shims) {
  return shims.map(function (s) {
    var bits = [esc(s.artifact)];
    if (s.for) bits.push("for " + esc(s.for));
    bits.push("liquidates " + esc(s.liquidation));
    bits.push(esc(s.declared));
    return "<div>" + bits.join(" · ") + "</div>";
  }).join("");
}

function nodeHeader(n) {
  var g = (DG.data.graphs || {})[n.graph] || {};
  var eyebrow = [esc(g.about || n.graph || "")];

  var items = [];
  items.push(fact("form", esc(formWord(n.form))));
  items.push(fact("authority", authorityHtml(n)));
  items.push(fact("rank", '<span class="num">' + fmtPct(n.rank) + "</span>"));
  if (n.boost != null) items.push(fact("boost", '<span class="num">' + fmtPct(n.boost) + "</span>"));
  if (n.ceiling) items.push(fact("ceiling", nodeLink(n.ceiling)));
  if (n.tier === "global") items.push(fact("tier", "global"));
  if (n.under && n.under.length) {
    items.push(fact("refines", n.under.map(function (id) { return nodeLink(id); }).join('<span class="sep">·</span>')));
  }
  if (n.after && n.after.length) {
    items.push(fact("after", n.after.map(function (id) { return nodeLink(id); }).join('<span class="sep">·</span>')));
  }
  if (n.shims && n.shims.length) {
    items.push(fact("shims", shimsHtml(n.shims)));
  }
  items.push(fact(
    "id",
    '<span class="idv mono">' + esc(n.id) + '</span><button type="button" class="copy" data-copy="' + esc(n.id) + '">copy</button>',
    "This id is the node's address: the browser opens it by this id and remembers it as your place in the record."
  ));

  return '<p class="eyebrow">' + eyebrow.join(" &nbsp; ") + "</p>" +
    "<h1 tabindex=\"-1\" id=\"nodetitle\">" + esc(n.question || n.id) + "</h1>" +
    '<dl class="facts">' + items.join("") + "</dl>" +
    draftNoteHtml(n) +
    alternativesHtml(n);
}

/* A reading's own page has to carry the citation it is a reading of. */
function readsSection(n) {
  if (n.form !== "reading" || (!n.source && !n.relation)) return "";
  return '<section><h2 class="sect">Reads</h2><div class="reading solo">' +
    (n.relation ? '<div class="rhead">' + relBadge(n.relation) + "</div>" : "") +
    (n.source ? '<p class="src">' + esc(n.source) + "</p>" : "") +
    "</div></section>";
}

function answerSection(n) {
  if (!n.answer) return "";
  var html = mdHtml(n.answer);
  var lead = '<span class="lead">' + esc(formWord(n.form)) + ".</span>";
  html = html.indexOf("<p>") === 0 ? "<p>" + lead + html.slice(3) : "<p>" + lead + "</p>" + html;
  var unstamped = !(n.authority && n.authority.class) ? " unstamped" : "";
  return '<section class="answer"><h2 class="sect">Answer</h2>' +
    '<div class="mdbody' + unstamped + '">' + html + "</div></section>";
}

function rationaleSection(n) {
  if (!n.rationale) return "";
  return '<section><h2 class="sect">Rationale</h2><div class="mdbody">' + groupRejected(mdBlocks(n.rationale)) + "</div></section>";
}

function accountSection(n) {
  if (!n.account) return "";
  return '<section><h2 class="sect">Account</h2><div class="propblock">' +
    '<p class="blk-label">the AI\'s account</p>' +
    '<div class="mdbody">' + mdHtml(n.account) + "</div></div></section>";
}

function instrumentSection(n) {
  var ins = n.instrument;
  if (!ins) return "";
  return '<section><h2 class="sect">Instrument</h2><div class="instr">' +
    '<p class="kind">' + esc(ins.kind || "instrument") + "</p>" +
    '<p class="ref">' + esc(ins.ref || "") + "</p>" +
    (ins.note ? '<p class="note">' + esc(ins.note) + "</p>" : "") +
    "</div></section>";
}

function relBadge(relation) {
  var rel = String(relation || "").toLowerCase();
  var cls = rel === "adopted" || rel === "diverged" || rel === "chosen-over" ? rel : "other";
  var word = rel === "chosen-over" ? "chosen over" : (rel || "reading");
  return '<span class="badge ' + cls + '">' + esc(word) + "</span>";
}

function readingBlock(r) {
  var a = r.authority;
  var stamp = a && a.class
    ? [STATUS_WORD[a.class] || a.class].concat(a.by ? ["by " + a.by] : [], a.date ? [a.date] : []).join(" · ")
    : "unstamped";
  return '<article class="reading">' +
    '<div class="rhead">' + relBadge(r.relation) + "</div>" +
    '<h3 class="rq2"><a href="#' + esc(r.id) + '">' + esc(r.question || r.id) + "</a></h3>" +
    (r.source ? '<p class="src">' + esc(r.source) + "</p>" : "") +
    '<p class="stamp">' + esc(stamp) + "</p>" +
    (r.answer ? '<div class="mdbody">' + mdHtml(r.answer) + "</div>" : "") +
    '<p class="more"><a href="#' + esc(r.id) + '">Read this reading</a></p>' +
    "</article>";
}

function traditionsSection(kids) {
  var readings = kids.filter(function (k) { return k.form === "reading"; });
  if (!readings.length) return "";
  return '<section><h2 class="sect">Traditions</h2><div class="readings">' +
    readings.map(readingBlock).join("") + "</div></section>";
}

function refinementsSection(kids) {
  var rest = kids.filter(function (k) { return k.form !== "reading"; });
  if (!rest.length) return "";
  var cards = rest.map(function (k) {
    return '<a class="card" href="#' + esc(k.id) + '">' +
      '<h3 class="cq">' + esc(k.question || k.id) + "</h3>" +
      '<p class="cmeta"><span>' + esc(formWord(k.form)) + "</span>" +
      stampPill(k, true) + unansweredPill(k, true) +
      '<span class="num">' + fmtPct(k.rank) + "</span></p></a>";
  }).join("");
  return '<section><h2 class="sect">Refinements</h2><div class="cards">' + cards + "</div></section>";
}

function citesSection(n) {
  var cites = n.cites || [];
  if (!cites.length) return "";
  var items = cites.map(function (c) {
    var h = c.hash ? String(c.hash) : "";
    return "<li>" + nodeLink(c.id) +
      (h ? '<span class="hash" title="' + esc(h) + '">' + esc(h.slice(0, 12)) + "</span>" : "") +
      "</li>";
  }).join("");
  return '<section><h2 class="sect">Cites</h2><ul class="cites">' + items + "</ul></section>";
}

function renderNode(n) {
  var kids = childrenOf(n);
  return "<article>" +
    nodeHeader(n) +
    readsSection(n) +
    answerSection(n) +
    rationaleSection(n) +
    accountSection(n) +
    instrumentSection(n) +
    traditionsSection(kids) +
    refinementsSection(kids) +
    citesSection(n) +
    "</article>";
}

function renderMissing(id) {
  var d = defaultNode();
  return '<h1 tabindex="-1" id="nodetitle">No such question</h1>' +
    '<p class="lede">Nothing in this record has the id <span class="mono">' + esc(id) + "</span>.</p>" +
    (d ? '<p><a href="#' + esc(d.id) + '">Go to ' + esc(d.question || d.id) + "</a></p>" : "");
}

/* ------------------------------------------------------------------ *
 * routing
 * ------------------------------------------------------------------ */

function readHash() {
  var raw = String(window.location.hash || "").replace(/^#/, "");
  try { raw = decodeURIComponent(raw); } catch (e) { /* leave raw */ }
  return raw;
}

/* The reader's place: the id of the last node successfully rendered. Kept in
   localStorage so an empty fragment reopens where the reader left off
   instead of always the default; every read and write is wrapped so a
   browser with storage disabled (or a test's injected stub) never breaks
   rendering. The optional `storage` argument is the injection point for
   tests -- production code always calls these with no argument and gets
   window.localStorage. */
var PLACE_KEY = "disposition-graph:last-node";

function savePlace(id, storage) {
  try { (storage || window.localStorage).setItem(PLACE_KEY, id); } catch (e) { /* storage unavailable */ }
}

function loadPlace(storage) {
  try { return (storage || window.localStorage).getItem(PLACE_KEY); } catch (e) { return null; }
}

/* The route choice itself, kept pure and apart from resolveRoute() so it can
   be tested without a DOM. A non-empty fragment always wins; an empty one
   falls back to the remembered place when that id still names a node, then
   to the graph's default. */
function chooseRoute(hash, storedId, hasNode, defaultId) {
  var h = hash;
  // The retired vocabulary and bootstrap views fall back to the graph's
  // default route, the same as an empty hash, rather than rendering.
  if (h === "~vocabulary" || h === "~bootstrap") h = "";
  if (h && hasNode(h)) return { kind: "node", id: h };
  if (h) return { kind: "missing", id: h };
  if (storedId && hasNode(storedId)) return { kind: "node", id: storedId, implicit: true };
  return defaultId ? { kind: "node", id: defaultId, implicit: true } : { kind: "missing", id: "" };
}

function resolveRoute() {
  var d = defaultNode();
  return chooseRoute(readHash(), loadPlace(), function (id) { return DG.byId.has(id); }, d ? d.id : null);
}

function render(initial) {
  var route = resolveRoute();
  DG.route = route;
  var main = document.getElementById("main");
  var title = "Disposition Graph";
  var selfId = null;

  if (route.kind === "node") {
    var n = DG.byId.get(route.id);
    selfId = n.id;
    main.innerHTML = renderNode(n);
    title = (n.question || n.id) + " · Disposition Graph";
    savePlace(n.id);
    if (route.implicit) {
      try { window.history.replaceState(null, "", "#" + n.id); } catch (e) { /* hash stays empty */ }
    }
  } else {
    main.innerHTML = renderMissing(route.id);
  }

  linkTerms(main, selfId);
  document.title = title;
  renderTree(document.getElementById("q").value);
  hideTip();

  if (initial !== true) {
    window.scrollTo(0, 0);
    var h1 = document.getElementById("nodetitle");
    if (h1) h1.focus({ preventScroll: true });
    if (window.innerWidth < 940) setNav(false);
  }
}

/* ------------------------------------------------------------------ *
 * tooltip
 * ------------------------------------------------------------------ */

function hideTip() {
  var tip = document.getElementById("tip");
  if (tip) tip.hidden = true;
}

function showTip(a) {
  var def = DG.termMap.get(a.getAttribute("data-term"));
  if (!def) return;
  var tip = document.getElementById("tip");
  tip.innerHTML = '<span class="tq">' + esc(def.question || def.term) + "</span>" +
    (def.sentence ? '<span class="ta">' + esc(def.sentence) + "</span>" : "");
  tip.style.left = "0px";
  tip.style.top = "0px";
  tip.hidden = false;
  var r = a.getBoundingClientRect();
  var box = tip.getBoundingClientRect();
  var left = Math.max(8, Math.min(r.left, window.innerWidth - box.width - 8));
  var top = r.bottom + 8;
  if (top + box.height > window.innerHeight - 8) top = Math.max(8, r.top - box.height - 8);
  tip.style.left = left + "px";
  tip.style.top = top + "px";
}

/* ------------------------------------------------------------------ *
 * chrome
 * ------------------------------------------------------------------ */

function setNav(open) {
  document.body.setAttribute("data-nav", open ? "open" : "closed");
  document.getElementById("btn-nav").setAttribute("aria-expanded", open ? "true" : "false");
}

function applyTheme(mode) {
  DG.theme = mode;
  if (mode === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", mode);
  document.getElementById("btn-theme").textContent = "Theme: " + mode;
  try { window.localStorage.setItem("dg-theme", mode); } catch (e) { /* storage unavailable */ }
}

function measureMast() {
  var mast = document.querySelector(".mast");
  if (mast) document.documentElement.style.setProperty("--mast-h", mast.offsetHeight + "px");
}

function renderChrome() {
  var d = DG.data;
  var n = (d.nodes || []).length;
  document.getElementById("refline").textContent = [d.module, d.ref].filter(Boolean).join(" · ");
  document.getElementById("foot").innerHTML =
    "<span>" + esc([d.module, d.ref].filter(Boolean).join(" / ")) + "</span>" +
    "<span>" + n + " question" + (n === 1 ? "" : "s") + "</span>" +
    "<span>projected from the record; history in git</span>";
}

function dgBoot() {
  var raw = document.getElementById("graph").textContent;
  DG.data = JSON.parse(raw);
  index();

  try {
    var saved = window.localStorage.getItem("dg-theme");
    if (saved === "light" || saved === "dark" || saved === "auto") DG.theme = saved;
  } catch (e) { /* storage unavailable */ }
  applyTheme(DG.theme);

  renderChrome();
  setNav(false);
  render(true);
  measureMast();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureMast);

  window.addEventListener("hashchange", function () { render(false); });
  window.addEventListener("resize", function () { measureMast(); hideTip(); });
  window.addEventListener("scroll", hideTip, true);

  document.getElementById("q").addEventListener("input", function (e) { renderTree(e.target.value); });
  document.getElementById("q").addEventListener("keydown", function (e) {
    if (e.key === "Escape") { e.target.value = ""; renderTree(""); }
  });
  document.getElementById("btn-nav").addEventListener("click", function () {
    setNav(document.body.getAttribute("data-nav") !== "open");
  });
  document.getElementById("btn-skip").addEventListener("click", function () {
    document.getElementById("main").focus();
  });
  document.getElementById("btn-theme").addEventListener("click", function () {
    applyTheme(DG.theme === "auto" ? "light" : DG.theme === "light" ? "dark" : "auto");
  });
  document.getElementById("wordmark").addEventListener("click", function (e) {
    var d = defaultNode();
    if (!d) return;
    e.preventDefault();
    if (readHash() === d.id) render(false);
    else window.location.hash = "#" + d.id;
  });

  document.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest("[data-copy]") : null;
    if (!btn) return;
    var text = btn.getAttribute("data-copy");
    var done = function (word) {
      btn.textContent = word;
      window.setTimeout(function () { btn.textContent = "copy"; }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done("copied"); }, function () { selectId(btn, done); });
    } else {
      selectId(btn, done);
    }
  });

  document.addEventListener("mouseover", function (e) {
    var a = e.target.closest ? e.target.closest(".dfn") : null;
    if (a) showTip(a);
  });
  document.addEventListener("mouseout", function (e) {
    if (e.target.closest && e.target.closest(".dfn")) hideTip();
  });
  document.addEventListener("focusin", function (e) {
    var a = e.target.closest ? e.target.closest(".dfn") : null;
    if (a) showTip(a);
  });
  document.addEventListener("focusout", hideTip);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") hideTip();
    if (e.key === "/" && !/^(INPUT|TEXTAREA)$/.test((document.activeElement || document.body).nodeName)) {
      e.preventDefault();
      if (window.innerWidth < 940) setNav(true);
      document.getElementById("q").focus();
    }
  });
}

function selectId(btn, done) {
  var idv = btn.parentNode ? btn.parentNode.querySelector(".idv") : null;
  if (!idv) { done("copy"); return; }
  var range = document.createRange();
  range.selectNodeContents(idv);
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  done("selected");
}

if (typeof document !== "undefined") dgBoot();
</script>
